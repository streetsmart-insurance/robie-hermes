# Production opt-in. This pull request does not install this file.
# Host: hermes-poc-01. Confirm the running gateway unit before writing
# the drop-in. It is usually hermes-gateway.service. If the active unit
# is robie-gateway.service, install the drop-in on that unit instead.
#
# Leave this file uninstalled and ROBIE_PLAYGROUND stays off. Installing
# it turns the Chat playground on in Production. EZLynx writes stay on
# the existing allowlist. This file does not change binding, payments,
# action-gate rules, or outbound client email.
#
#   install -d /etc/systemd/system/hermes-gateway.service.d
#   install -m 0644 deploy/systemd/production-playground.conf \
#     /etc/systemd/system/hermes-gateway.service.d/production-playground.conf
#   systemctl daemon-reload
#   systemctl restart hermes-gateway
#
# Then run the same-day check with the gateway's environment:
#   python3 scripts/check_robie_playground_health.py --unit hermes-gateway.service
# A nonzero exit means the flag is on but the AI provider is missing,
# or today's Chat jobs all failed.

[Service]
Environment=ROBIE_PLAYGROUND=1
