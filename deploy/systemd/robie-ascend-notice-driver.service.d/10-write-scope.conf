[Service]
# This drop-in belongs only to robie-ascend-notice-driver.service.
# It does not change the compiled default or any other unit.
# ROBIE_EZLYNX_WRITE_SCOPE=all is applicant-wide. The guard has no
# per-action switch. The driver refuses every write that is not a note
# on an existing titled discussion.
Environment=ROBIE_EZLYNX_WRITE_SCOPE=all
Environment=ROBIE_PLAYGROUND=1
