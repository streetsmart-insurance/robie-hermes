[Service]
# Live API filing store, in its own folder. A missing file means this
# driver files the email. It skips when this live file has a filed row for
# the same key. A Payment failed email skips only when the same policy and
# the same invoice (or the same due date and amount) are already filed.
# If this file cannot be read, a Payment failed email is held and not
# posted. The dry-run database is not read. This drop-in does not change
# User= or the mailbox allowlist.
Environment=ASCEND_API_NOTICE_DB=/opt/streetsmart-hermes/robie-job-engine/data/ascend-api/ascend_api_notice_events.db
