# An intentional `systemctl stop` makes run_team_lead_chat_eod.sh trap
# SIGTERM and exit 80. Treat that as success so OnFailure= does not send a
# false ACTION REQUIRED alert. Lock-busy (75) and Chat post failures still
# alert. A TimeoutStartSec expiry is Result=timeout and still alerts.
[Service]
SuccessExitStatus=80
