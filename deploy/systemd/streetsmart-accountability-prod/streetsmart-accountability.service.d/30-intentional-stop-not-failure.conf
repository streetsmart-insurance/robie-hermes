# An intentional `systemctl stop` makes run_daily_accountability_vm.sh trap
# SIGTERM and exit 80 (STOPPED_EXIT). Treat that as success so OnFailure= does
# not send a false ACTION REQUIRED alert. Every other nonzero exit (75 lock
# busy, 124 inner timeout, 143 python killed alone, any report failure) still
# fails and alerts. A TimeoutStartSec expiry is Result=timeout and still
# alerts even if the wrapper exits 80.
[Service]
SuccessExitStatus=80
