# Test host only. This pull request does not install this file.
# Host: hermes-test-01. Unit: robie-gateway.service.
# Do not install this file on hermes-poc-01. Production uses
# deploy/systemd/production-playground.conf, and only after Carlo asks
# for the flag on that host. The flag is off until that drop-in is installed.
# Confirm the running unit before writing the drop-in.
#
#   install -d /etc/systemd/system/robie-gateway.service.d
#   install -m 0644 deploy/systemd/test-playground.conf \
#     /etc/systemd/system/robie-gateway.service.d/test-playground.conf
#   systemctl daemon-reload
#   systemctl restart robie-gateway
#
# The shared Chat bridge is separate. Set ROBIE_TEST_CHAT_SPACES on that
# Cloud Run service only after Carlo's GO. See the pull request.

[Service]
Environment=ROBIE_PLAYGROUND=1
