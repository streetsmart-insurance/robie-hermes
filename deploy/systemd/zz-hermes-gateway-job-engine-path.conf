[Service]
# This file intentionally sorts after override.conf. The gateway's base Hermes
# runtime lives under /srv/robie, but the canonical Job Engine must load first
# so an older vendored robie_job_engine package cannot be imported.
Environment="PYTHONPATH=/opt/streetsmart-hermes/robie-job-engine:/srv/robie/current/vendor:/srv/robie/current"
Environment="ROBIE_CANONICAL_JOB_ENGINE_ROOT=/opt/streetsmart-hermes/robie-job-engine"
