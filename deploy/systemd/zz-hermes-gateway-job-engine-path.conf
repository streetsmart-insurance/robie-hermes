[Service]
# This file intentionally sorts after override.conf. The gateway's base Hermes
# runtime lives under /srv/robie, but the canonical immutable release must load
# first so an older vendored package cannot be imported. The deployment process
# atomically points releases/current at the verified extracted artifact.
# Never use /opt/streetsmart-hermes/robie-job-engine here: that flattened
# working directory contains secrets.py and can shadow Python's stdlib module.
Environment="PYTHONPATH=/opt/streetsmart-hermes/releases/current:/srv/robie/current/vendor:/srv/robie/current"
Environment="ROBIE_CANONICAL_JOB_ENGINE_ROOT=/opt/streetsmart-hermes/releases/current"
Environment="ROBIE_EZLYNX_LOGIN_HELPER=/opt/streetsmart-hermes/releases/current/ezlynx_login_bootstrap.py"
Environment="ROBIE_EZLYNX_SESSION_LOCK=/opt/streetsmart-hermes/robie-job-engine/data/ezlynx-session.lock"
# A short renewable queue lease gives hard-kill recovery a bounded delay;
# the worker heartbeat keeps healthy long Playwright runs exclusively owned.
Environment="ROBIE_CHAT_QUEUE_LEASE_SECONDS=120"
Environment="ROBIE_PREFLIGHT_CHAT_SPACE=spaces/AAQAZbLJO78"
Environment="ROBIE_PREFLIGHT_FAIL_NOTIFY=carlo@streetsmart.insurance,jake@streetsmart.insurance"
# Zip deploy path is pointer flip then hermes-gateway restart. This
# ExecStartPost is the post-restart Production pre-flight. The leading
# '-' keeps a no from taking hermes-gateway down. Do not restart Chrome,
# the gateway, or the browser from the pre-flight.
ExecStartPost=-/home/streetsmart-hermes/.hermes/hermes-agent/venv/bin/python -m robie_job_engine.production_preflight
# Same deploy path starts the regression battery. --detach so a long
# suite does not block hermes-gateway ready. Leading '-' keeps a NEW
# fail from taking the gateway down. Does not merge, deploy, or restart
# the gateway. Chat on NEW fail only; never @robie.
Environment="ROBIE_REGRESSION_CHAT_SPACE=spaces/AAQAZbLJO78"
Environment="ROBIE_REGRESSION_WORK_DIR=/var/lib/robie-regression-battery"
ExecStartPost=-/home/streetsmart-hermes/.hermes/hermes-agent/venv/bin/python -m robie_job_engine.regression_battery --notify --detach
