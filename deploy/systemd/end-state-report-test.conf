# Test drop-in. Do not install this file on Production (hermes-poc-01)
# as part of this change. The flag itself is honored wherever it is
# set, including Production. Default remains off.
#
# Install on hermes-test-01 only, on the gateway that actually serves
# Chat. Handoff names that unit robie-gateway.service. The Test app
# root is /opt/streetsmart-hermes-test.
[Service]
Environment=ROBIE_END_STATE_REPORT=1
# Optional. Jobs at or above this confidence do not escalate when the
# verdict is correct. Default is 70.
# Environment=ROBIE_END_STATE_CONFIDENCE_THRESHOLD=70
# Optional override. Leave unset so the process reads Secret Manager
# secret jev-api-key in project streetsmart-hermes-poc.
# Environment=JEV_API_KEY=
