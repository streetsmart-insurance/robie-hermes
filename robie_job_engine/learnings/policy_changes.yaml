# Policy-change worker learnings
# Each entry: id (pc-NNN), rule, learned (YYYY-MM-DD), source.
# Append new learnings at the end. Keep rules to one or two sentences.
learnings:
  - id: pc-001
    rule: "Every change item served to Carlo carries: effective date, policy number, carrier, and the exact requested change. No item goes to Carlo without its date."
    learned: "2026-10-04"
    source: "Carlo standing rule"
  - id: pc-002
    rule: "Robie never keys change requests or transactions into EZLynx. When a carrier confirmation or document comes back, hand it to the CSR/AM to enter."
    learned: "2026-10-04"
    source: "Carlo standing rule"
  - id: pc-003
    rule: "Policy-change emails CC the CSR and AM, the full email content is filed to the correct EZLynx discussion via the Discussion API, and existing carrier threads are continued rather than duplicated."
    learned: "2026-10-04"
    source: "Carlo standing rule"
  - id: pc-004
    rule: "Any ambiguity or anomaly (name/VIN/date mismatch): EDIT the task itself via the wrench icon - reassign to the AM, set the due date so it surfaces in their queue (same day on a weekday, Monday if found on a weekend), and put the clarification question plus resend instruction in the task body. A discussion note alone is not enough."
    learned: "2026-10-04"
    source: "Carlo correction via screenshots"
  - id: pc-005
    rule: "The AM clarifies AND resends the change request to the carrier if necessary. Robie does not resend the request; Robie is the buffer, then chases the carrier."
    learned: "2026-10-04"
    source: "Carlo standing rule"
  - id: pc-006
    rule: "Completed endorsement procedure: obtain and open the endorsement, file it, compare line-by-line to the original request, record exact match/differences, hand to CSR for final confirmation."
    learned: "2026-10-04"
    source: "Carlo standing rule"
  - id: pc-007
    rule: "Categorize every change: Chase the carrier, AM/CSR ambiguity, Client must act, Blocked on dependency, Data mismatch, Needs Carlo's call, Stale/likely dead, External party, or Cancel change request. 'Cancel change request' is its own category - distinct from cancelling the policy."
    learned: "2026-10-04"
    source: "Carlo standing rule"
  - id: pc-008
    rule: "Internal policy notes are not the request. Verify against the actual carrier submission - the Clean Seat file showed limits/PD changes in an internal note that were never submitted; the real submitted request was a driver add."
    learned: "2026-10-04"
    source: "Clean Seat reconciliation"
  - id: pc-009
    rule: "NJCRIB is not a carrier. Policies read 'NJ Crib Travelers Assigned Risk' or 'NJ Crib Hartford Assigned Risk' - always use the servicing carrier's contacts (Travelers or Hartford), never NJCRIB directly."
    learned: "2026-10-04"
    source: "Carlo standing rule"
  - id: pc-010
    rule: "Missed carrier cancellation (notice never made it to the file): email Nicole, Alejandro, and Gabriela Chutin (gabrielac@ - NOT gabriela@, it bounces) from robie@ asking whether the notice came through the mail and was missed, then file the email to the account's EZLynx discussion."
    learned: "2026-10-04"
    source: "Top Rank case, Carlo standing rule"
  - id: pc-011
    rule: "Carrier follow-ups go through the carrier portal before falling back to email."
    learned: "2026-10-04"
    source: "Carlo standing rule"
  - id: pc-012
    rule: "While monitoring a task, post status updates every 3-5 days, not daily."
    learned: "2026-10-04"
    source: "Carlo standing rule"
  - id: pc-013
    rule: "Stale items over 14 days with no movement may be nudged via an EZLynx task note (visible to the team lead) without asking Carlo first. Always read the EZLynx notes first so nothing already handled gets chased."
    learned: "2026-10-04"
    source: "Carlo standing permission"
