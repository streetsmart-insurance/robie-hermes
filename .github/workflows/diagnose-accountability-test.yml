name: Diagnose Test accountability readiness (read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-accountability-test.yml
      - scripts/diagnose-accountability-test-readonly.py
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DIAGNOSE_ACCOUNTABILITY_TEST_READINESS
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.confirmation == 'DIAGNOSE_ACCOUNTABILITY_TEST_READINESS')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Test
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      TEST_VM: hermes-test-01
      STAGING: /var/tmp/robie-accountability-readiness/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/1036123102831/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: robie-test-deployer@streetsmart-robie-test.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Refuse every target except Test
        run: |
          set -euo pipefail
          test "${TEST_VM}" = hermes-test-01
          test "${PROJECT_ID}" = streetsmart-hermes-poc
      - name: Run redacted read-only readiness proof
        run: |
          set -euo pipefail
          gcloud compute ssh "${TEST_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-test-01 && mkdir -p '${STAGING}'"
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/diagnose-accountability-test-readonly.py "${TEST_VM}:${STAGING}/"
          gcloud compute ssh "${TEST_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="sudo env PYTHONPATH=/opt/streetsmart-hermes-test/releases/current/.gateway-runtime:/opt/streetsmart-hermes-test/releases/current python3 '${STAGING}/diagnose-accountability-test-readonly.py'" \
            | tee "${RUNNER_TEMP}/accountability-readiness.json"
      - name: Publish redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accountability-test-readiness
          path: ${{ runner.temp }}/accountability-readiness.json
          if-no-files-found: warn
          retention-days: 30
