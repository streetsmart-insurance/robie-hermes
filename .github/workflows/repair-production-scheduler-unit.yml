name: Repair Production scheduler unit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REPAIR_SCHEDULER_UNIT_ON_HERMES_POC_01
        required: true
        type: string
      expect_sha:
        description: Expected Production release commit prefix (for post-repair audit)
        required: false
        default: 7758a91de97b
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'REPAIR_SCHEDULER_UNIT_ON_HERMES_POC_01'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
      EXPECT_SHA: ${{ inputs.expect_sha }}
      STAGING: /tmp/robie-scheduler-repair/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Refuse every target except Production
        run: |
          set -euo pipefail
          test "${PRODUCTION_VM}" = "hermes-poc-01"
          test "${PROJECT_ID}" = "streetsmart-hermes-poc"
          test "${ZONE}" = "us-east1-b"
          case "${EXPECT_SHA}" in
            ""|*[!0-9a-f]*) echo "expect_sha must be a hex prefix" >&2; exit 1;;
          esac
      - name: Deep venv permission diagnostics (read-only)
        run: |
          set -euo pipefail
          SSH="gcloud compute ssh ${PRODUCTION_VM} --project=${PROJECT_ID} --zone=${ZONE} --tunnel-through-iap"
          STAGING="/tmp/robie-scheduler-repair/${{ github.run_id }}-1"
          echo "=== path ownership chain ==="
          $SSH --command="sudo namei -l /home/streetsmart-hermes/.hermes/hermes-agent/venv/bin/python" || true
          echo "=== venv bin listing ==="
          $SSH --command="sudo ls -la /home/streetsmart-hermes/.hermes/hermes-agent/venv/bin/ 2>&1 | head -15" || true
          echo "=== gateway unit (how does the gateway run?) ==="
          $SSH --command="sudo systemctl cat hermes-gateway 2>&1 | head -45" || true
          echo "=== scheduler unit (current on-disk) ==="
          $SSH --command="sudo systemctl cat robie-scheduler 2>&1 | head -45" || true
          echo "=== gateway liveness ==="
          $SSH --command="sudo systemctl show hermes-gateway -p ActiveState -p SubState -p MainPID -p ExecMainStatus --no-pager" || true
      - name: Build ROBIE-owned scheduler venv under /opt
        run: |
          set -euo pipefail
          SSH="gcloud compute ssh ${PRODUCTION_VM} --project=${PROJECT_ID} --zone=${ZONE} --tunnel-through-iap"
          VENV=/opt/streetsmart-hermes/venv
          echo "=== system python ==="
          $SSH --command="python3 --version"
          $SSH --command="python3 -c 'import sys; assert sys.version_info >= (3,11), sys.version'" \
            || { echo "system python3 < 3.11, cannot build venv" >&2; exit 1; }
          echo "=== create venv if missing ==="
          $SSH --command="test -x ${VENV}/bin/python || sudo python3 -m venv ${VENV} || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv && sudo python3 -m venv ${VENV}; }"
          $SSH --command="sudo chown -R streetsmart-hermes:streetsmart-hermes ${VENV}"
          echo "=== install engine dependencies ==="
          $SSH --command="sudo -u streetsmart-hermes ${VENV}/bin/pip install -q 'google-api-python-client>=2.170,<3' 'google-auth>=2.40,<3' 'google-cloud-secret-manager>=2.24,<3' 'openpyxl>=3.1,<4' 'playwright>=1.52,<2' 'pypdf>=5,<7' 'PyYAML>=6.0,<7'"
          echo "=== verify imports as the service user ==="
          $SSH --command="sudo -u streetsmart-hermes PYTHONPATH=/opt/streetsmart-hermes/releases/current ${VENV}/bin/python -c 'import robie_job_engine.scheduler, playwright, google.cloud.secretmanager, yaml, openpyxl, pypdf, googleapiclient; print(98765)'"
      - name: Install fixed scheduler unit and restart the tick
        run: |
          set -euo pipefail
          SSH="gcloud compute ssh ${PRODUCTION_VM} --project=${PROJECT_ID} --zone=${ZONE} --tunnel-through-iap"
          $SSH --command="hostname -s && mkdir -p '${STAGING}' && ls -ld '${STAGING}'"
          # Diagnose (never fatal): which venv python can the service user execute?
          $SSH --command="echo SSH_USER=\$(whoami); ls -la /home/streetsmart-hermes/.hermes/hermes-agent/venv/bin/python || true; echo ---; sudo -u streetsmart-hermes whoami && echo SUDO_AS_USER_OK || echo SUDO_AS_USER_FAIL; sudo -u streetsmart-hermes test -x /home/streetsmart-hermes/.hermes/hermes-agent/venv/bin/python && echo HOME_VENV_X_OK || echo HOME_VENV_X_FAIL; ls -la /opt/streetsmart-hermes/.hermes/hermes-agent/venv/bin/python 2>/dev/null || echo OPT_VENV_MISSING; echo ---; sudo systemctl show hermes-gateway -p NRestarts -p ExecMainStatus -p ActiveEnterTimestamp --no-pager || true"
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            deploy/systemd/robie-scheduler.service deploy/systemd/robie-scheduler.timer \
            scripts/audit-production-workers-readonly.py "${PRODUCTION_VM}:${STAGING}/"
          echo "--- diff of unit about to be installed ---"
          $SSH --command="diff -u /etc/systemd/system/robie-scheduler.service '${STAGING}/robie-scheduler.service' || true"
          VENV_CHECK=$($SSH --command="sudo -u streetsmart-hermes PYTHONPATH=/opt/streetsmart-hermes/releases/current /opt/streetsmart-hermes/venv/bin/python -c 'import robie_job_engine.scheduler; print(12345)'" 2>/dev/null | tail -1)
          echo "venv check result: ${VENV_CHECK}"
          if [ "${VENV_CHECK}" != "12345" ]; then echo "Refusing: ROBIE venv cannot import the scheduler as the service user" >&2; exit 1; fi
          $SSH --command="sudo install -o root -g root -m 0644 '${STAGING}/robie-scheduler.service' /etc/systemd/system/robie-scheduler.service"
          $SSH --command="sudo install -o root -g root -m 0644 '${STAGING}/robie-scheduler.timer' /etc/systemd/system/robie-scheduler.timer"
          $SSH --command="sudo systemctl daemon-reload"
          $SSH --command="sudo systemctl enable --now robie-scheduler.timer"
          # Trigger one immediate tick, then let the timer fire on its own.
          $SSH --command="sudo systemctl restart robie-scheduler.service"
          echo "Waiting for timer-driven ticks..."
          sleep 150
      - name: Verify the tick is green
        run: |
          set -euo pipefail
          SSH="gcloud compute ssh ${PRODUCTION_VM} --project=${PROJECT_ID} --zone=${ZONE} --tunnel-through-iap"
          $SSH --command="sudo python3 '${STAGING}/audit-production-workers-readonly.py' --expect-sha '${EXPECT_SHA}'" \
            | tee "${RUNNER_TEMP}/scheduler-repair-audit.json"
          python3 - <<'PYEOF'
          import json, os
          d = json.load(open(os.environ["RUNNER_TEMP"] + "/scheduler-repair-audit.json"))
          tick = d["scheduler_tick"]
          print(json.dumps(tick, indent=2))
          assert tick["timer_active"] and tick["timer_enabled"], "timer not active+enabled"
          assert (tick["last_exec_status"] or "").strip() == "0", \
              f"last tick failed, exec status={tick['last_exec_status']}"
          assert tick["journal_lines_30min"] > 0, "no tick ran in the last 30 min"
          print("SCHEDULER TICK GREEN")
          PYEOF
      - name: Publish evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-repair-audit
          path: ${{ runner.temp }}/scheduler-repair-audit.json
          if-no-files-found: warn
          retention-days: 30
