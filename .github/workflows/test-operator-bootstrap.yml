name: Test inspection-only bounded bootstrap

on:
  issue_comment:
    types: [created]

permissions: {}

env:
  OPERATOR_ENABLED: ${{ vars.ROBIE_TEST_OPERATOR_BOOTSTRAP_ENABLED }}
  OPERATOR_ISSUE: ${{ vars.ROBIE_TEST_OPERATOR_ISSUE }}
  OPERATOR_ACTOR_IDS: '320188404'
  OPERATOR_SETUP_COMMIT: ${{ vars.ROBIE_TEST_OPERATOR_SETUP_COMMIT }}
  OPERATOR_EVENT_PROOF_RUN_ID: ${{ vars.ROBIE_TEST_OPERATOR_EVENT_PROOF_RUN_ID }}

jobs:
  authorize:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'streetsmart-insurance/robie-hermes' &&
      vars.ROBIE_TEST_OPERATOR_BOOTSTRAP_ENABLED == 'BOOTSTRAP_INSPECT_V1' &&
      github.sha == vars.ROBIE_TEST_OPERATOR_SETUP_COMMIT &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/robie-test bootstrap-inspect ')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate fresh command and current actor permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/test_operator_request.py
      - name: Require same-commit successful connector event proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/test_operator_setup_proof.py

  bootstrap:
    needs: authorize
    if: needs.authorize.result == 'success' && github.ref == 'refs/heads/main'
    concurrency:
      group: robie-hermes-test-deploy
      cancel-in-progress: false
    environment: Test-Operator-Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Revalidate authorization and expiry after queue or environment wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/test_operator_request.py
      - name: Require same-commit successful connector event proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/test_operator_setup_proof.py
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/1036123102831/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: robie-test-deployer@streetsmart-robie-test.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Require existing instance OS Login before temporary registration
        shell: bash
        run: |
          set -euo pipefail
          value=$(gcloud compute instances describe hermes-test-01 \
            --project=streetsmart-hermes-poc --zone=us-east1-b \
            --format='value(metadata.items.filter("key=enable-oslogin").map().extract(value).flatten())')
          test "${value^^}" = TRUE
      - name: Register approved one-hour OS Login key
        env:
          OSLOGIN_SSH_KEY_TTL: 1h
        run: bash scripts/ensure-gcloud-ssh-key.sh
      - name: Render only the fixed reviewed inspection bootstrap
        run: python3 -I -B scripts/test_operator_bootstrap.py > "${RUNNER_TEMP}/inspection-bootstrap.py"
      - name: Install fixed inspection helper and config through existing root route
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh hermes-test-01 \
            --project=streetsmart-hermes-poc --zone=us-east1-b --tunnel-through-iap \
            --ssh-key-file="${HOME}/.ssh/google_compute_engine" --ssh-key-expire-after=1h \
            --quiet --ssh-flag=-T --ssh-flag=-oBatchMode=yes --ssh-flag=-oConnectTimeout=20 \
            --command='sudo -n /usr/bin/python3 -I -B -' \
            < "${RUNNER_TEMP}/inspection-bootstrap.py" > "${RUNNER_TEMP}/inspection-bootstrap-result.json"
          python3 -c 'import hashlib,json,pathlib,os; d=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"inspection-bootstrap-result.json").read_text()); assert d["host"] == "hermes-test-01" and d["controller_commit"] == os.environ["GITHUB_SHA"]; assert d["helper_sha256"] == hashlib.sha256(pathlib.Path("scripts/test_operator_inspect.py").read_bytes()).hexdigest(); assert d["stopped_operations_enabled_by_bootstrap"] is False and d["runtime_changed"] is False'
      - uses: actions/upload-artifact@v4
        with:
          name: test-inspection-bootstrap-${{ github.run_id }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/operator-request.json
            ${{ runner.temp }}/bootstrap-proof.json
            ${{ runner.temp }}/inspection-bootstrap-result.json
          if-no-files-found: error
