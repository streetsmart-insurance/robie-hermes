name: Read-only worker process audit (release staleness)

# Read-only diagnostic on hermes-poc-01. Answers one question:
# is the live ROBIE worker process actually running the deployed release,
# or did it start before the pointer flip (stale)?
#
# Strictly read-only: reads the release symlink, file hashes, and /proc.
# No writes, no restarts, no secret values.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_WORKER_PROCESS
        required: true
        type: string
      expect_sha:
        description: Expected release commit prefix (e.g. a8d52882)
        required: true
        type: string

permissions:
  contents: read
id-token: <redacted>

jobs:
  audit:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'AUDIT_WORKER_PROCESS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
      EXPECT_SHA: ${{ inputs.expect_sha }}
      STAGING: /var/tmp/robie-proc-audit/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Refuse every target except Production
        run: |
          set -euo pipefail
          test "${PRODUCTION_VM}" = "hermes-poc-01"
          test "${PROJECT_ID}" = "streetsmart-hermes-poc"
          test "${ZONE}" = "us-east1-b"
          case "${EXPECT_SHA}" in
            ""|*[!0-9a-f]*) echo "expect_sha must be a hex prefix" >&2; exit 1;;
          esac
      - name: Read-only worker process audit on hermes-poc-01
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-poc-01 && mkdir -p '${STAGING}'"
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/audit-worker-process-readonly.py "${PRODUCTION_VM}:${STAGING}/"
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="sudo python3 '${STAGING}/audit-worker-process-readonly.py' --expect-sha '${EXPECT_SHA}'" \
            | tee "${RUNNER_TEMP}/worker-process-audit.json"
          python3 -m json.tool "${RUNNER_TEMP}/worker-process-audit.json" >/dev/null
      - name: Cleanup remote staging
        if: always()
        run: |
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="rm -rf '${STAGING}'" || true
      - name: Publish evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-process-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/worker-process-audit.json
          if-no-files-found: error
          retention-days: 30
