name: Legacy mailbox safety gate

on:
  pull_request:
    branches:
      - server-prod
    paths:
      - "src/email_outreach/robie_inbox_cleaner.py"
      - "src/email_outreach/uw_reply_filer.py"
      - "scripts/run_daily_robie_cleaner.sh"
      - "tests/test_robie_inbox_cleaner.py"
      - "tests/test_uw_reply_filer.py"
      - ".github/workflows/legacy-mailbox-ci.yml"

permissions:
  contents: read

jobs:
  mailbox-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed change
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared and test-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . markdown bandit ruff

      - name: Compile changed runtime modules
        run: |
          python -m py_compile \
            src/email_outreach/robie_inbox_cleaner.py \
            src/email_outreach/uw_reply_filer.py

      - name: Run focused regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_robie_inbox_cleaner.py \
            tests/test_uw_reply_filer.py

      - name: Run fatal lint and security checks
        run: |
          ruff check --select F,E9 \
            src/email_outreach/robie_inbox_cleaner.py \
            src/email_outreach/uw_reply_filer.py \
            tests/test_robie_inbox_cleaner.py \
            tests/test_uw_reply_filer.py
          bandit -q -r \
            src/email_outreach/robie_inbox_cleaner.py \
            src/email_outreach/uw_reply_filer.py
