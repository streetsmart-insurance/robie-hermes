name: Read-only Test job audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_B74CFA81_ON_HERMES_TEST_01
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'AUDIT_B74CFA81_ON_HERMES_TEST_01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Test
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      TEST_VM: hermes-test-01
      JOB_DB: /opt/streetsmart-hermes-test/robie-job-engine/data/jobs.db
      JOB_PREFIX: b74cfa81
      STAGING: /var/tmp/robie-readonly-audit/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1036123102831/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: robie-test-deployer@streetsmart-robie-test.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Refuse every target except Test
        run: |
          set -euo pipefail
          test "${TEST_VM}" = hermes-test-01
          test "${JOB_DB}" = /opt/streetsmart-hermes-test/robie-job-engine/data/jobs.db
          test "${JOB_PREFIX}" = b74cfa81
      - name: Run redacted read-only database audit
        run: |
          set -euo pipefail
          gcloud compute ssh "${TEST_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-test-01 && mkdir -p '${STAGING}'"
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/audit-test-job-readonly.py "${TEST_VM}:${STAGING}/"
          gcloud compute ssh "${TEST_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="sudo python3 '${STAGING}/audit-test-job-readonly.py' --db '${JOB_DB}' --job-prefix '${JOB_PREFIX}'" \
            | tee "${RUNNER_TEMP}/job-audit.json"
          python3 -m json.tool "${RUNNER_TEMP}/job-audit.json" >/dev/null
      - name: Publish evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: b74cfa81-readonly-audit
          path: ${{ runner.temp }}/job-audit.json
          if-no-files-found: error
          retention-days: 30
