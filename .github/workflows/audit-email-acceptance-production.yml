name: Read-only Production email acceptance audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_EMAIL_ACCEPTANCE_ON_HERMES_POC_01
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'AUDIT_EMAIL_ACCEPTANCE_ON_HERMES_POC_01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
      JOB_DB: /opt/streetsmart-hermes/robie-job-engine/data/jobs.db
      JOB_PREFIX: bd5b832e
      STAGING: /var/tmp/robie-readonly-audit/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Refuse every target except Production
        run: |
          set -euo pipefail
          test "${PRODUCTION_VM}" = hermes-poc-01
          test "${JOB_DB}" = /opt/streetsmart-hermes/robie-job-engine/data/jobs.db
          test "${JOB_PREFIX}" = bd5b832e
      - name: Run redacted read-only database audit
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-poc-01 && mkdir -p '${STAGING}'"
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/diagnose-email-acceptance-readonly.py "${PRODUCTION_VM}:${STAGING}/"
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="sudo python3 '${STAGING}/diagnose-email-acceptance-readonly.py'" \
            | tee "${RUNNER_TEMP}/job-audit.json"
          python3 -m json.tool "${RUNNER_TEMP}/job-audit.json" >/dev/null
      - name: Publish evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: email-policy-acceptance-readonly-audit
          path: ${{ runner.temp }}/job-audit.json
          if-no-files-found: error
          retention-days: 30
