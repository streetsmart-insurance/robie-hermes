name: ROBIE verification gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject sensitive files
        run: |
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.db' -o -name '*.sqlite*' -o -name '*credentials*.json' -o -name '*token*.json' \) -print -quit | grep -q .; then
            echo "Sensitive or runtime file found in repository"
            exit 1
          fi
      - name: Install test and workbook dependencies
        run: python -m pip install "pytest>=8.3,<9" "openpyxl>=3.1,<4" "pypdf>=5,<7" "PyYAML>=6.0,<7"
      - name: Install Google Chat bridge dependencies
        run: python -m pip install -r services/chat-http-bridge/requirements.txt "cryptography>=41,<46"
      - name: Test Google Chat bridge
        run: PYTHONPATH=services/chat-http-bridge python -m unittest discover -s services/chat-http-bridge -p 'test_*.py' -v
      - name: Test Zapier Bland webhook (Robie Call typed-number hard block)
        run: |
          python -m pip install "Flask>=3.0" "requests>=2.31"
          cd services/zapier-bland-webhook && python -m pytest -q -p no:cacheprovider tests
      - name: Compile source
        run: PYTHONPYCACHEPREFIX=/tmp/robie-pyc python -m compileall -q deploy/hermes integrations robie_job_engine src tests
      - name: Test Chat approval cards
        run: PYTHONPATH=. python -m pytest -q tests/test_confirmation_chat_buttons.py tests/test_confirmation_origin_notify.py
      - name: Test exact task identity and durable note acceptance
        run: PYTHONPATH=.:tests python -m pytest -q tests/test_ezlynx_task_intake.py tests/test_task_intake_safety.py tests/test_call_handler_wiring.py tests/test_robie_call_handler.py tests/test_robie_call_edge_cases.py tests/test_robie_call_hardening.py tests/test_robie_call_review_blockers.py tests/test_call_contact.py tests/test_ezlynx_create_task_honesty.py tests/test_bland_transport_only_egress.py tests/test_bland_prod_transport.py tests/test_bland_prod_rules.py tests/test_bland_prod_scripts.py tests/test_splice_workflow_labels.py tests/test_report_clock.py tests/test_call_label_match.py tests/test_seen_task_report_cap.py tests/test_task_intake_health_probe.py tests/test_task_intake_prod_wiring.py tests/test_task_intake_review_blockers.py tests/test_bland_prod_double_dial.py tests/test_note_label_pickup.py tests/test_bland_go_live_values.py
      - name: Run regression battery
        run: PYTHONPATH=. python -m robie_job_engine.regression_battery --ci
      - name: Test durable Chat generations and reply recovery
        run: PYTHONPATH=.:tests python -m pytest -q tests/test_chat_review_concurrency.py tests/test_durable_turn_generations.py tests/test_chat_reply_recovery.py tests/test_reply_and_go_guards.py tests/test_discussion_note_readback.py
      - name: Test selective Chat lifecycle and environment reconciliation
        run: PYTHONPATH=.:tests python -m pytest -q tests/test_chat_reconciliation.py tests/test_pubsub_ack.py tests/test_chat_click_ownership.py tests/test_round19_refused_tool_and_quota.py tests/test_round20_plan_text_does_not_finalize.py
      - name: Test exact-package promotion guards
        run: PYTHONPATH=. python -m pytest -q tests/test_release_promotion.py tests/test_production_deploy_workflow.py tests/test_chat_release_scope.py tests/test_test_deploy_workflow.py tests/test_test_stopped_install.py
      - name: Test bounded Test operator authorization and stopped operations
        run: PYTHONPATH=. python -m pytest -q tests/test_test_operator_inspect.py tests/test_test_operator_stopped.py tests/test_test_operator_bootstrap.py tests/test_test_cloud_deploy.py
      - name: Test mortgagee email scope and independent verification
        run: |
          PYTHONPATH=.:tests python -m unittest tests.test_mortgagee_email_scope tests.test_report_email_source tests.test_report_fetcher
          PYTHONPATH=.:tests python -m pytest -q tests/test_mortgagee_verification_worker.py
      - name: Test accountability evidence and dashboard pipeline
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_ringcentral_workbooks.py \
            tests/test_ringcentral_email_sync.py \
            tests/test_accountability_cli.py \
            tests/test_accountability_jobs.py \
            tests/test_business_calendar.py \
            tests/test_department_accountability.py \
            tests/test_google_sheets_accountability.py \
            tests/test_gmail_sent_readback_metadata.py \
            tests/test_submission_center_controls.py \
            tests/test_magellan_collection.py \
            tests/test_accountability_dashboard.py \
            tests/test_accountability_connections.py \
            tests/test_scheduled_report_email_sync.py \
            tests/test_center_audits.py \
            tests/test_operational_trackers.py \
            tests/test_submission_audit_runtime.py \
            tests/test_submission_audit_runner_contract.py \
            tests/test_overdue_submission_reports.py \
            tests/test_ezlynx_overdue_submission_skill.py \
            tests/test_reporting_suite.py \
            tests/test_role_accountability.py \
            tests/test_productivity_engine.py \
            tests/test_run_daily_accountability_vm.py \
            tests/test_accountability_timer_install_workflow.py \
            tests/test_accountability_delivery_watchdog.py \
            tests/test_repair_dedicated_accountability_google_docs.py \
            tests/test_repair_dedicated_accountability_magellan_sentiment_heading.py \
            tests/test_magellan_sad_identity.py \
            tests/test_repair_dedicated_accountability_magellan_sad_identity.py \
            tests/test_magellan_session_acl.py \
            tests/test_magellan_empty_gate.py \
            tests/test_repair_dedicated_accountability_magellan_empty.py \
            tests/test_repair_dedicated_accountability_submission_gate.py \
            tests/test_repair_dedicated_accountability_submission_boundary.py \
            tests/test_team_lead_chat_eod.py \
            tests/test_evening_collection_target.py \
            tests/test_preflight_dedicated_accountability_submission.py \
            tests/test_ezlynx_api.py \
            tests/test_browser_proxy_units.py \
            tests/test_mortgagee_enrichment.py \
            tests/test_verification_workers.py
          PYTHONPATH=. python -m pytest -q tests/test_release_profile.py
      - name: Test production job client scope
        run: PYTHONPATH=.:tests python -m pytest -q tests/test_production_job_scope.py tests/test_ezlynx_write_scope.py tests/test_production_deploy_workflow.py tests/test_email_acceptance_audit.py tests/test_email_agent_runner.py tests/test_ezlynx_policy_setup_profiles.py tests/test_policy_skill_release.py tests/test_hermes_tool_visibility.py tests/test_ezlynx_document_tool.py tests/test_canary_create_policy.py tests/test_zapier_skill.py tests/test_zapier_resolver.py
      - name: Test email intake filter (skip reactions, reports, FYI forwards)
        run: PYTHONPATH=.:tests python -m pytest -q tests/test_email_intake_filter.py tests/test_email_release_runtime.py tests/test_end_state_report.py tests/test_email_cc_preservation.py
      - name: Test scheduler sweep redaction and ExecStart parsing
        run: PYTHONPATH=.:tests python -m pytest -q tests/test_sweep_box_schedulers.py
      - name: Test chat intake quiet inbox and preflight alert delivery
        run: PYTHONPATH=.:tests python -m pytest -q tests/test_production_preflight.py tests/test_health_check_import_root.py tests/test_health_check_profile.py
      - name: Test document retrieval filing
        run: ROBIE_ENV=TEST PYTHONPATH=. python -m unittest tests.test_document_retrieval_filing tests.test_progressive_fao_memo tests.test_gemini_ui_rescue
      - name: Test Ascend API notice source
        run: PYTHONPATH=. python -m pytest -q tests/test_ascend_api_notice_source.py tests/test_ascend_notice_driver.py tests/test_ascend_unmatched_digest.py tests/test_install_ascend_unmatched_digest.py tests/test_ascend_stuck_and_agreements.py

      - name: Test Secret Manager reader against the real package name
        run: |
          python -m pip install "google-cloud-secret-manager>=2.24,<3"
          python -c "import importlib.util as u; assert u.find_spec('google.cloud.secretmanager') is not None"
          PYTHONPATH=. python -m pytest -q -rs tests/test_gcp_secret_reader.py
      - name: Build immutable release candidate
        run: bash scripts/build-release.sh "$RUNNER_TEMP/releases"

  canonical-paths:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canonical ephemeral-path tests (macOS /private/tmp)
        run: |
          PYTHONPATH=.:tests python -m unittest \
            tests.test_engineering_report_p0p1.EngineeringReportP0P1Tests.test_canonical_ephemeral_paths_rejected_including_macos_private_tmp \
            tests.test_engineering_report_p0p1.EngineeringReportP0P1Tests.test_phase04_durable_idempotency_at_most_one_action \
            -v
