name: Hermes tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Reject committed secrets and runtime files
        run: |
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.db' -o -name '*.sqlite*' -o -name '*credentials*.json' -o -name '*token*.json' \) -print -quit | grep -q .; then
            echo "Sensitive or runtime file found in repository"
            exit 1
          fi

      - name: Compile source
        run: PYTHONPYCACHEPREFIX=/tmp/robie-pyc python -m compileall -q robie_job_engine tests

      - name: Run test suite
        run: PYTHONPATH=. python -m pytest -q
