name: Test-only JE-KILL-01 live proof

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_JE_KILL_01_ON_HERMES_TEST_01
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  je-kill-test:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'RUN_JE_KILL_01_ON_HERMES_TEST_01'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Test
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      TEST_VM: hermes-test-01
      TEST_ROOT: /opt/streetsmart-hermes-test
      FIXTURE: /opt/streetsmart-hermes-test/je-kill/fixture.json
      RUN_ROOT: /opt/streetsmart-hermes-test/je-kill/runs
      STAGING_ROOT: /var/tmp/robie-je-kill
      ROBIE_ENV: TEST
      SSH_KEY: /tmp/hermes-test-je-kill
      OSLOGIN_SSH_KEY_TTL: 1h
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with short-lived Test identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1036123102831/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: robie-test-deployer@streetsmart-robie-test.iam.gserviceaccount.com
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Prepare short-lived OS Login SSH key
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ensure-gcloud-ssh-key.sh
          cp "${HOME}/.ssh/google_compute_engine" "${SSH_KEY}"
          cp "${HOME}/.ssh/google_compute_engine.pub" "${SSH_KEY}.pub"
      - name: Refuse every target except the protected Test runtime
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          test "${TEST_VM}" = hermes-test-01
          test "${TEST_ROOT}" = /opt/streetsmart-hermes-test
          test "${FIXTURE}" = /opt/streetsmart-hermes-test/je-kill/fixture.json
          test "${RUN_ROOT}" = /opt/streetsmart-hermes-test/je-kill/runs
          test "${ROBIE_ENV}" = TEST
          gcloud compute instances describe "${TEST_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" \
            --format='value(name,status)' | grep -q '^hermes-test-01[[:space:]]\+RUNNING$'
      - name: Transfer exact remote runner to Test
        shell: bash
        run: |
          set -euo pipefail
          staging="${STAGING_ROOT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud compute ssh "${TEST_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --ssh-key-file="${SSH_KEY}" \
            --command="test \"\$(hostname -s)\" = hermes-test-01 && mkdir -p '${staging}'"
          gcloud compute scp \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --ssh-key-file="${SSH_KEY}" \
            scripts/run-je-kill-test-remote.sh \
            "${TEST_VM}:${staging}/"
      - name: Run guarded process-death proof on Test
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:12}"
          staging="${STAGING_ROOT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_log="${RUNNER_TEMP}/je-kill-remote.log"
          if ! gcloud compute ssh "${TEST_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --ssh-key-file="${SSH_KEY}" \
            --command="sudo env ROBIE_ENV=TEST EXPECTED_SHA='${short}' TEST_ROOT='${TEST_ROOT}' FIXTURE='${FIXTURE}' RUN_ROOT='${RUN_ROOT}' bash -c 'cd \"${TEST_ROOT}\" && bash \"${staging}/run-je-kill-test-remote.sh\"'" \
            2>&1 | tee "${remote_log}"; then
            echo "JE-KILL FAILED: remote runner exited nonzero" >&2
            exit 3
          fi
          grep -Fq 'JE-KILL REMOTE VERIFIED' "${remote_log}" || {
            echo "JE-KILL UNVERIFIED: remote proof sentinel missing" >&2
            exit 3
          }
