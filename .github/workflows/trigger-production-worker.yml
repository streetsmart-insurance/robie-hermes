name: Trigger Production worker run

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_WORKER_ON_HERMES_POC_01
        required: true
        type: string
      worker:
        description: Worker to run
        required: true
        type: choice
        options: [manual-renewal, audit, mortgagee]
        default: manual-renewal

permissions:
  contents: read
  id-token: write

jobs:
  trigger:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN_WORKER_ON_HERMES_POC_01'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Production
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
      JOB_DB: /opt/streetsmart-hermes/robie-job-engine/data/jobs.db
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Refuse every target except Production
        run: |
          set -euo pipefail
          test "${PRODUCTION_VM}" = "hermes-poc-01"
          test "${PROJECT_ID}" = "streetsmart-hermes-poc"
      - name: Create worker job and observe
        run: |
          set -euo pipefail
          case "${{ inputs.worker }}" in
            manual-renewal) ACTION=manual_renewal_verification; PAYLOAD='{"worker":"manual-renewal","report_id":"4247"}' ;;
            audit)           ACTION=audit_verification;            PAYLOAD='{"worker":"audit-verification","report_id":"4246"}' ;;
            mortgagee)       ACTION=mortgagee_verification;       PAYLOAD='{"worker":"mortgagee-verification","report_id":"4372"}' ;;
          esac
          echo "action=${ACTION}"
          SSH="gcloud compute ssh ${PRODUCTION_VM} --project=${PROJECT_ID} --zone=${ZONE} --tunnel-through-iap"
          REMOTE_DIR=/var/tmp/robie-worker-trigger/${{ github.run_id }}
          $SSH --command="mkdir -p ${REMOTE_DIR}"
          gcloud compute scp scripts/trigger_worker_job.py scripts/worker_job_status.py \
            "${PRODUCTION_VM}:${REMOTE_DIR}/" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap
          JOB_ID=$($SSH --command="sudo python3 ${REMOTE_DIR}/trigger_worker_job.py '${ACTION}' '${PAYLOAD}' 'manual-trigger-${ACTION}-${{ github.run_id }}'" 2>&1 | tail -1)
          echo "JOB_ID=${JOB_ID}" | tee "${RUNNER_TEMP}/trigger.env"
          test -n "${JOB_ID}"
          echo "Created job ${JOB_ID}; scheduler tick picks it up within ~60s."
          TERMINAL=0
          for i in $(seq 1 80); do
            # NB: stderr is discarded — gcloud prints WARNING lines there, and
            # 2>&1 used to promote the warning to the "status", so the loop
            # never saw a terminal state. Only the script's stdout line 1 is
            # the job status. ROBIE emits UPPERCASE statuses.
            if ! OUT=$($SSH --command="sudo python3 ${REMOTE_DIR}/worker_job_status.py '${JOB_ID}'" 2>/dev/null); then
              echo "[$(date -u +%H:%M:%S)] WARN: status check SSH failed (attempt ${i}); retrying" >&2
              sleep 60
              continue
            fi
            STATE=$(printf '%s' "${OUT}" | head -1 | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')
            echo "[$(date -u +%H:%M:%S)] job ${JOB_ID} status=${STATE}"
            case "${STATE}" in
              COMPLETED|FAILED|CANCELLED|MISSING) TERMINAL=1; break ;;
            esac
            sleep 60
          done
          if [ "${TERMINAL}" -eq 0 ]; then
            echo "ERROR: job ${JOB_ID} did not reach a terminal state within 80 minutes" >&2
            exit 1
          fi
          echo "--- final job record ---"
          $SSH --command="sudo python3 ${REMOTE_DIR}/worker_job_status.py '${JOB_ID}'" 2>/dev/null | tail -n +2 | tee "${RUNNER_TEMP}/trigger-result.json"
      - name: Publish evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-worker-trigger-${{ inputs.worker }}
          path: ${{ runner.temp }}/trigger*.json
          if-no-files-found: warn
          retention-days: 30
