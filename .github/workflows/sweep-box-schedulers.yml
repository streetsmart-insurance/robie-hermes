name: Sweep hermes-poc-01 schedulers (read-only)

# Read-only sweep of hermes-poc-01 for the hourly inbox processor.
# Something on the box fires every hour at ~:00:16-:00:28 ET: it sends
# "Robie Daily Mailbox Audit & Cleanup Report" and "[URGENT / CSR ACTION]
# Carrier Response Received" emails as robie@streetsmart.insurance and logs
# notes to EZLynx via REST API. It is NOT in the engine's scheduled_jobs
# table, NOT in the repo, and NOT a repo systemd timer. This sweep checks
# the remaining scheduler surfaces: systemd timers/units, user and system
# crontabs, and recent process starts.
#
# Touches nothing. systemctl/journalctl/crontab queries only; the script
# writes no files and redacts anything that looks like a secret. The sweep
# result is written in plain English to the job summary.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SWEEP_SCHEDULERS_ON_HERMES_POC_01
        required: true
        type: string
      hours:
        description: How many hours of process-start history to look at
        required: false
        type: string
        default: "3"

permissions:
  contents: read
  id-token: write

jobs:
  sweep:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'SWEEP_SCHEDULERS_ON_HERMES_POC_01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
      STAGING: /var/tmp/robie-scheduler-sweep/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3

      - name: Refuse every target except Production
        run: |
          set -euo pipefail
          test "${PRODUCTION_VM}" = "hermes-poc-01"
          test "${PROJECT_ID}" = "streetsmart-hermes-poc"

      - name: Sweep schedulers
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-poc-01 && mkdir -p '${STAGING}'"
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/sweep_box_schedulers_readonly.py "${PRODUCTION_VM}:${STAGING}/"
          set +e
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="sudo python3 ${STAGING}/sweep_box_schedulers_readonly.py --hours ${{ inputs.hours }}" \
            2>&1 | tee "${RUNNER_TEMP}/schedulers.txt"
          rc=${PIPESTATUS[0]}
          set -e

          if [ "${rc}" -eq 0 ]; then
            HEAD="## Found a scheduler candidate — see WHAT THIS MEANS at the bottom"
          else
            HEAD="## No scheduler candidate found on this box"
          fi
          {
            echo "${HEAD}"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/schedulers.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          # Reporting no candidate is a successful sweep, not a failed run.
          exit 0

      - name: Publish output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-sweep-${{ github.run_id }}
          path: ${{ runner.temp }}/schedulers.txt
          if-no-files-found: warn
          retention-days: 30
