name: Run accountability now (dedicated server)

# Manual, fail-closed run of the standalone accountability application.
# This workflow intentionally does not provision the general Hermes runtime.
# The scheduled weekday run remains owned by systemd on the dedicated VM.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_ACCOUNTABILITY_NOW
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: streetsmart-accountability-production
  cancel-in-progress: false

jobs:
  run-accountability:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN_ACCOUNTABILITY_NOW'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: Production
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: streetsmart-accountability-prod
      APP_ROOT: /opt/streetsmart-daily-accountability
      UNIT: streetsmart-accountability.service
      TIMER: streetsmart-accountability.timer
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3

      - name: Inspect the dedicated VM state
        run: |
          set -euo pipefail
          test "${PRODUCTION_VM}" = "streetsmart-accountability-prod"
          status="$(gcloud compute instances describe "${PRODUCTION_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --format='value(status)')"
          if [ "${status}" != "RUNNING" ]; then
            echo "::error::Dedicated accountability VM is not RUNNING (state=${status:-unknown})."
            exit 1
          fi
          echo "dedicated instance state: RUNNING"

      - name: Confirm the dedicated accountability target
        run: |
          set -euo pipefail
          test "${PRODUCTION_VM}" = "streetsmart-accountability-prod"
          test "${APP_ROOT}" = "/opt/streetsmart-daily-accountability"
          if ! ssh_output="$(gcloud compute ssh "${PRODUCTION_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --quiet --command="hostname -s" 2>&1)"; then
            echo "::error::Could not SSH to the dedicated accountability VM. The gcloud error below distinguishes OS Login, IAP, instance-state, and network failures."
            printf '%s\n' "${ssh_output}" >&2
            exit 1
          fi
          host="$(printf '%s\n' "${ssh_output}" | tail -1 | tr -d '\r')"
          if [ "${host}" != "streetsmart-accountability-prod" ]; then
            echo "::error::Dedicated target hostname mismatch."
            exit 1
          fi
          echo "dedicated target confirmed"

      - name: Install the canonical weekday timer
        run: |
          set -euo pipefail
          remote_timer="/tmp/streetsmart-accountability-${GITHUB_RUN_ID}.timer"
          gcloud compute scp deploy/systemd/streetsmart-accountability.timer \
            "${PRODUCTION_VM}:${remote_timer}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap --quiet
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" \
            --tunnel-through-iap --command="sudo install -o root -g root -m 0644 ${remote_timer} /etc/systemd/system/streetsmart-accountability.timer && sudo rm -f ${remote_timer} && sudo systemctl daemon-reload"

      - name: Verify installed fail-closed runtime
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" \
            --tunnel-through-iap --command="sudo bash -s" <<'CHECK_EOF'
          set -euo pipefail
          test "$(hostname -s)" = "streetsmart-accountability-prod"
          test -x /opt/streetsmart-daily-accountability/venv/bin/python
          test -x /opt/streetsmart-daily-accountability/scripts/run_daily_accountability_vm.sh
          test -f /opt/streetsmart-daily-accountability/src/production_main.py
          echo "installed_service_unit_begin"
          systemctl cat streetsmart-accountability.service --no-pager
          echo "installed_service_unit_end"
          echo "installed_timer_unit_begin"
          systemctl cat streetsmart-accountability.timer --no-pager
          echo "installed_timer_unit_end"
          systemctl cat streetsmart-accountability.service --no-pager |
            grep -Fq 'ExecStart=/opt/streetsmart-daily-accountability/scripts/run_daily_accountability_vm.sh'
          systemctl cat streetsmart-accountability.timer --no-pager |
            grep -Fq 'OnCalendar=Mon..Fri *-*-* 09:00:00 America/New_York'
          systemctl cat streetsmart-accountability.timer --no-pager |
            grep -Fq 'Persistent=true'
          systemctl enable --now streetsmart-accountability.timer
          systemctl is-enabled --quiet streetsmart-accountability.timer
          systemctl is-active --quiet streetsmart-accountability.timer
          CHECK_EOF

      - name: Run the dedicated accountability service
        run: |
          set -euo pipefail
          if ! gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" \
            --tunnel-through-iap --command="sudo systemctl start ${UNIT}"; then
            echo "::error::Accountability service failed; systemd result metadata follows."
            gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" \
              --tunnel-through-iap --command="sudo systemctl show ${UNIT} --no-pager -p Result -p ExecMainCode -p ExecMainStatus -p ExecMainStartTimestamp -p ExecMainExitTimestamp -p StatusText" || true
            exit 1
          fi
          echo "accountability service completed"

      - name: Verify exact prior-business-day delivery
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" \
            --tunnel-through-iap --command="sudo -u ubuntu bash -s" <<'VERIFY_EOF' > "${RUNNER_TEMP}/accountability-verification.json"
          set -euo pipefail
          cd /opt/streetsmart-daily-accountability
          PYTHONPATH=/opt/streetsmart-daily-accountability venv/bin/python - <<'PYEOF'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from src.engine.date_utils import get_previous_business_day

          state_path = Path("data/run_state/last_success.json")
          if not state_path.is_file():
              raise SystemExit("missing verified success marker")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          today = datetime.now(ZoneInfo("America/New_York")).date()
          expected = get_previous_business_day(today).isoformat()
          observed = str(state.get("target_date") or "")
          if observed != expected:
              raise SystemExit(f"stale report date: expected {expected}, observed {observed or 'missing'}")
          if str(state.get("run_date") or "") != today.isoformat():
              raise SystemExit("success marker was not created by today's run")
          if not str(state.get("document_url") or "").startswith("https://docs.google.com/document/"):
              raise SystemExit("verified Google Doc URL is missing")
          print(json.dumps({
              "verified": True,
              "host": "streetsmart-accountability-prod",
              "run_date": today.isoformat(),
              "target_date": observed,
              "document_url_present": True,
              "delivery_marker": str(state_path),
          }, sort_keys=True))
          PYEOF
          VERIFY_EOF
          cat "${RUNNER_TEMP}/accountability-verification.json" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload redacted verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accountability-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/accountability-verification.json
          if-no-files-found: warn
          retention-days: 30
