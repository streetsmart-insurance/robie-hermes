name: Run accountability now (hermes-poc-01)

# One-shot manual run of the StreetSmart daily accountability report on the
# Robie job engine (hermes-poc-01). Approved by Carlo 2026-09-14 (the 6:00 AM
# ET scheduled start did not fire; this is the manual takeover run).
#
# What it does on the box:
#   1. Creates /opt/streetsmart-hermes/accountability/connection-manifest.json
#      if missing (exact Production manifest below), then validates it.
#   2. Creates /etc/streetsmart-hermes/robie-accountability.env if missing.
#      The file holds Secret Manager *resource names* only, never values
#      (per deploy/systemd/robie-ezlynx.env.example: "Store only Secret
#      Manager resource names here, never credential values"). Each name is
#      verified to exist via `gcloud secrets describe` before writing.
#      Mode 0600. An existing file is left untouched.
#   3. Runs the accountability connection check against the manifest's
#      production_required_connections — fails closed if not ready.
#   4. Runs `run_accountability_job.py daily` through the durable job engine
#      as the job-DB owner. The runner itself fails closed (nonzero exit
#      unless status COMPLETE).
#   5. Uploads the redacted run output as a workflow artifact.
#
# What it does NOT do: enable the systemd timer (separate governed step).
#
# Runner note: this uses runs-on: ubuntu-latest + gcloud SSH into the box,
# the proven repo pattern (sweep-box-schedulers.yml and friends). There is no
# self-hosted runner registered on hermes-poc-01 (runners API 403 for the
# deploy token; zero workflows in this repo use self-hosted). Pointing
# runs-on at [self-hosted] with no runner online would hang the workflow
# forever waiting for a runner that never picks it up.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_ACCOUNTABILITY_NOW
        required: true
        type: string

permissions:
  contents: read
id-token: write

jobs:
  run-accountability:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN_ACCOUNTABILITY_NOW'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
      BOX_MANIFEST: /opt/streetsmart-hermes/accountability/connection-manifest.json
      BOX_ENV_FILE: /etc/streetsmart-hermes/robie-accountability.env
      BOX_VENV_PY: /opt/streetsmart-hermes/.hermes/hermes-agent/venv/bin/python
      BOX_RELEASE: /opt/streetsmart-hermes/releases/current
      BOX_JOB_DB: /opt/streetsmart-hermes/robie-job-engine/data/jobs.db
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3

      - name: Refuse every target except Production
        run: |
          set -euo pipefail
          test "${PRODUCTION_VM}" = "hermes-poc-01"
          test "${PROJECT_ID}" = "streetsmart-hermes-poc"
          HOST="$(gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" \
            --tunnel-through-iap --command="hostname -s" 2>/dev/null | tail -1 | tr -d '\r')"
          test "${HOST}" = "hermes-poc-01"
          echo "target confirmed: ${HOST}"

      - name: Verify required Secret Manager secrets exist
        run: |
          set -euo pipefail
          # Full secret-version resource names (required by
          # GoogleSecretManagerAccessor.access(); bare names raise ValueError).
          # Names confirmed in repo docs:
          #   ezlynx-username / ezlynx-password  (LOGIN_SECRETS.md)
          #   magellan-username / magellan-password
          #     (docs/ACCOUNTABILITY_PRODUCTION_ACTIVATION_2026-09-06.md)
          for s in ezlynx-username ezlynx-password magellan-username magellan-password; do
            gcloud secrets describe "${s}" --project="${PROJECT_ID}" > /dev/null
            echo "secret OK: ${s}"
          done

      - name: Provision manifest and env file on the box
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" \
            --tunnel-through-iap --command="sudo bash -s" <<PROVISION_EOF
          set -euo pipefail
          MANIFEST="${BOX_MANIFEST}"
          ENVFILE="${BOX_ENV_FILE}"
          VENVPY="${BOX_VENV_PY}"

          if [ ! -f "\${MANIFEST}" ]; then
            sudo mkdir -p "\$(dirname "\${MANIFEST}")"
            sudo tee "\${MANIFEST}" > /dev/null <<'MANIFEST_JSON'
          {
            "safety": {"environment": "Production"},
            "rules": {
              "daily_reporting_period": "previous_business_day",
              "holiday_calendar": "US-FEDERAL",
              "require_complete_evidence": true,
              "production_required_connections": ["ringcentral", "ezlynx", "gmail", "magellan", "google_sheets", "delivery"]
            }
          }
          MANIFEST_JSON
            sudo chmod 0644 "\${MANIFEST}"
            echo "manifest created: \${MANIFEST}"
          else
            echo "manifest already present — validating only"
          fi

          "\${VENVPY}" - "\${MANIFEST}" <<'PYEOF'
          import json, sys
          path = sys.argv[1]
          try:
              m = json.load(open(path))
          except Exception as e:
              print(f"FAIL: manifest is not valid JSON: {e}", file=sys.stderr)
              sys.exit(1)
          env = str((m.get("safety") or {}).get("environment") or "").strip().lower()
          if env != "production":
              print(f"FAIL: safety.environment must be 'Production', got {env!r}", file=sys.stderr)
              sys.exit(1)
          req = (m.get("rules") or {}).get("production_required_connections")
          if not isinstance(req, list) or not req:
              print("FAIL: rules.production_required_connections missing or empty", file=sys.stderr)
              sys.exit(1)
          print("manifest OK — required connections:", ", ".join(req))
          PYEOF

          if [ ! -f "\${ENVFILE}" ]; then
            sudo mkdir -p "\$(dirname "\${ENVFILE}")"
            sudo tee "\${ENVFILE}" > /dev/null <<ENV_VARS
          # Generated by run-accountability-now workflow. Secret Manager resource
          # names only — never credential values. Mode 0600. Full
          # projects/.../secrets/.../versions/... form is required by
          # GoogleSecretManagerAccessor.access() (see
          # tests/test_secret_reference_format.py); bare names raise ValueError.
          ROBIE_ACCOUNTABILITY_MANIFEST=\${MANIFEST}
          ROBIE_EZLYNX_USERNAME_SECRET=projects/streetsmart-hermes-poc/secrets/ezlynx-username/versions/latest
          ROBIE_EZLYNX_PASSWORD_SECRET=projects/streetsmart-hermes-poc/secrets/ezlynx-password/versions/latest
          ROBIE_MAGELLAN_USERNAME_SECRET=projects/streetsmart-hermes-poc/secrets/magellan-username/versions/latest
          ROBIE_MAGELLAN_PASSWORD_SECRET=projects/streetsmart-hermes-poc/secrets/magellan-password/versions/latest
          ACCOUNTABILITY_REPORT_MAILBOX=robie@streetsmart.insurance
          # Optional per deploy/systemd/robie-accountability.env.example; left
          # empty until Carlo approves each integration.
          RINGCENTRAL_CLIENT_ID=
          RINGCENTRAL_CLIENT_SECRET=
          RINGCENTRAL_JWT=
          APPSHEET_APP_ID=
          APPSHEET_APPLICATION_ACCESS_KEY=
          APPSHEET_REGION=www.appsheet.com
          ACCOUNTABILITY_GMAIL_DELEGATED_SERVICE_ACCOUNT=
          ACCOUNTABILITY_GMAIL_USERS=
          ENV_VARS
            sudo chmod 0600 "\${ENVFILE}"
            echo "env file created: \${ENVFILE}"
          else
            echo "env file already present — leaving untouched"
          fi
          PROVISION_EOF

      - name: Connection check (fail closed)
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" \
            --tunnel-through-iap --command="sudo bash -s" 2>/dev/null <<CHECK_EOF > "${RUNNER_TEMP}/conn-check.json"
          set -euo pipefail
          set -a
          source "${BOX_ENV_FILE}"
          set +a
          sudo -E env PYTHONPATH="${BOX_RELEASE}" ROBIE_ENV=Production "${BOX_VENV_PY}" \
            -m robie_job_engine.accountability_connections --manifest "${BOX_MANIFEST}"
          CHECK_EOF
          python3 - "${RUNNER_TEMP}/conn-check.json" <<'PYEOF'
          import json, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          m = re.search(r"\{", raw)
          if not m:
              print("FAIL: no JSON in connection-check output", file=sys.stderr)
              print(raw[:2000], file=sys.stderr)
              sys.exit(1)
          d = json.loads(raw[m.start():])
          if d.get("ready"):
              print("connections READY")
              sys.exit(0)
          print("FAIL: required accountability connections are not ready:", file=sys.stderr)
          for name, info in (d.get("connections") or {}).items():
              if isinstance(info, dict) and not info.get("ready", True):
                  print(f"  - {name}: not ready", file=sys.stderr)
          sys.exit(1)
          PYEOF

      - name: Run daily accountability job
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" \
            --tunnel-through-iap --command="test -x /opt/streetsmart-hermes/releases/current/scripts/run_accountability_job.py && test -x /opt/streetsmart-hermes/.hermes/hermes-agent/venv/bin/python"
          echo "runner script present"
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" \
            --tunnel-through-iap --command="sudo bash -s" <<RUN_EOF > "${RUNNER_TEMP}/accountability-raw.txt" 2>&1
          set -euo pipefail
          set -a
          source "${BOX_ENV_FILE}"
          set +a
          if [ ! -f "${BOX_JOB_DB}" ]; then
            echo "FAIL: job DB not found at ${BOX_JOB_DB} — refusing to guess the runtime user" >&2
            exit 1
          fi
          OWNER="$(stat -c '%U' "${BOX_JOB_DB}")"
          echo "running as job-engine owner: ${OWNER}"
          sudo -E -u "${OWNER}" env PYTHONPATH="${BOX_RELEASE}" ROBIE_ENV=Production "${BOX_VENV_PY}" \
            "${BOX_RELEASE}/scripts/run_accountability_job.py" daily
          RUN_EOF
          echo "job ssh exit: $?"

      - name: Redact and publish run output
        if: always()
        run: |
          python3 - "${RUNNER_TEMP}/accountability-raw.txt" "${RUNNER_TEMP}/accountability-output.txt" <<'PYEOF'
          import re, sys
          src, dst = sys.argv[1], sys.argv[2]
          try:
              text = open(src, encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              text = "(no job output captured)"
          # Keyword-based redaction only: never touches job IDs or structure.
          text = re.sub(r'(?i)\b(password|passwd|secret|client_secret|access_?key|jwt|bearer)\b(\s*[:=]\s*)(\S+)',
                        r'\1\2<redacted>', text)
          open(dst, "w", encoding="utf-8").write(text)
          print(f"redacted output written ({len(text)} chars)")
          PYEOF
          {
            echo "## Accountability run output (redacted)"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/accountability-output.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload redacted output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accountability-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/accountability-output.txt
            ${{ runner.temp }}/conn-check.json
          if-no-files-found: warn
          retention-days: 30
