name: Mint FormEntry retry and capture coverages (ONE more approved write)

# SECOND APPROVED WRITE -- Carlo authorized exactly one more activation on
# 2026-09-12 after the first approved mint (run 34697459460) fired the
# "Save & Continue Edit" activation but the page URL never changed within
# 60 seconds: no formEntryId was captured and whether a FormEntry was minted
# is UNVERIFIED. A read-only sweep (run 34697983457) then found no FormEntry
# tab open and zero FormEntry indicators on the Edit page.
#
# This workflow is the only sanctioned path for the retry. The v1 workflow
# (mint-formentry-and-capture-coverages.yml) stays as-is; do not merge them.
#
# What this run does differently from v1:
#   1. Before anything else, it inventories EVERY open tab on the CDP
#      browser and scans each URL for the FormEntry shape. V1 never looked
#      at other tabs -- if the first mint opened the FormEntry in a new
#      tab, v1 missed it and this run must not mint twice.
#   2. If a FormEntry URL is already open in any tab, the write is SKIPPED
#      (write_occurred=false, write_skipped_reason recorded) and the run
#      proceeds read-only on that tab: Coverages tab activation plus the
#      field and modal sweeps.
#   3. Otherwise it performs the ONE write exactly like v1: three runtime
#      preconditions, then activates "Save & Continue Edit" by EXACT
#      accessible name.
#   4. After the activation it scans the page AND every open tab for the
#      FormEntry URL shape and records the formEntryId literally.
#
# The gate below is the blunt style: literal greps over the script. The
# strings "Save Policy", "Save & Close" and "Submit" may not appear anywhere
# in the script, so the one click can never be retargeted at a different
# save control by a future edit.
#
# Dispatch ONLY from main: the Production environment's deployment branch
# policy allows main and nothing else.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MINT_FORMENTRY_D01_RETRY to confirm the second approved write
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  mint_retry:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'MINT_FORMENTRY_D01_RETRY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
      STAGING: /var/tmp/robie-formentry-mint-retry/${{ github.run_id }}
      APPLICANT_ID: "220250093"
      POLICY_ID: "83651751"
      ENTRY_URL: https://app.ezlynx.com/applicantportal/Policy/Actions/Edit/220250093/83651751
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: '584.0.0'  # Pinned 2026-09-12: runner-preinstalled gcloud 583.0.0 crashes on 'gcloud compute ssh' (TypeError: quote_from_bytes() expected bytes); 584.0.0 is the version setup-gcloud@latest resolved on run 34694728948, whose SSH staging succeeded.

      - name: Enforce single-write discipline
        run: |
          set -euo pipefail
          S=scripts/mint_formentry_retry_capture_coverages.py
          echo "== no fill/type/check/select_option =="
          ! grep -q '\.fill(' "$S"
          ! grep -q '\.type(' "$S"
          ! grep -q '\.check(' "$S"
          ! grep -q '\.select_option(' "$S"
          echo "== exactly one page.goto =="
          test "$(grep -c 'page.goto' "$S")" = "1"
          echo "== waits never use networkidle =="
          ! grep -q 'networkidle' "$S"
          echo "== exactly one click call site, exact-name matched =="
          test "$(grep -c '\.click(' "$S")" = "1"
          grep -q 'exact=True' "$S"
          grep -q '"Save & Continue Edit"' "$S"
          ! grep -q '\.first' "$S"
          ! grep -q 'nth(' "$S"
          echo "== allowlisted Edit URL present =="
          grep -q 'applicantportal/Policy/Actions/Edit/220250093/83651751' "$S"
          echo "== other save/submit control names absent =="
          ! grep -q 'Save Policy' "$S"
          ! grep -q 'Save & Close' "$S"
          ! grep -q 'Submit' "$S"
          echo "== skip-if-already-open path present =="
          grep -q 'write_skipped_reason' "$S"
          grep -q 'find_formentry_page' "$S"
          echo "== post-click tab scan present =="
          grep -q 'post_click_tab_inventory' "$S"
          echo "single-write gate OK"

      - name: Stage retry script on Production
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-poc-01 && mkdir -p '${STAGING}'"
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/mint_formentry_retry_capture_coverages.py "${PRODUCTION_VM}:${STAGING}/"

      - name: Run mint retry (ONE more approved write, then read-only capture)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="set -euo pipefail
              mkdir -p '${STAGING}'
              PY=''
              for cand in \$(ls -d /opt/streetsmart-hermes/.local/share/uv/python/*/bin/python3 2>/dev/null) \$(find /opt/streetsmart-hermes -maxdepth 5 -name pyvenv.cfg 2>/dev/null | head -5 | sed 's|pyvenv.cfg|bin/python|') \$(command -v python3 2>/dev/null || true); do
                [ -x \"\$cand\" ] || continue
                if \"\$cand\" -c 'import playwright' 2>/dev/null; then PY=\"\$cand\"; break; fi
                if sudo -n \"\$cand\" -c 'import playwright' 2>/dev/null; then PY=\"sudo -n \$cand\"; break; fi
              done
              if [ -z \"\$PY\" ]; then echo 'NO_PLAYWRIGHT_PYTHON'; exit 1; fi
              echo \"using python: \$PY\"
              if ! curl -sf --max-time 10 http://127.0.0.1:9222/json/version >/dev/null; then echo 'NO_CDP_LISTENER'; exit 1; fi
              echo 'CDP listener up'
              \$PY '${STAGING}/mint_formentry_retry_capture_coverages.py' --out '${STAGING}/dump.json'"

      - name: Retrieve dump
        id: retrieve
        if: always()
        run: |
          set -euo pipefail
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            "${PRODUCTION_VM}:${STAGING}/dump.json" "${RUNNER_TEMP}/formentry-mint-retry-dump.json"
          python3 - <<'EOF'
          import json, os
          p = os.path.join(os.environ["RUNNER_TEMP"], "formentry-mint-retry-dump.json")
          d = json.load(open(p))
          print("ok:", d.get("ok"))
          print("landing_url:", d.get("landing_url"))
          print("landing_looks_authenticated:", d.get("landing_looks_authenticated"))
          print("steps:")
          for s in d.get("steps", []):
              print("  ", s["step"], "->", s["url"])
          print("preconditions:", json.dumps(d.get("preconditions"), indent=2))
          print("write_occurred:", d.get("write_occurred"))
          print("write_skipped_reason:", d.get("write_skipped_reason"))
          print("write_action:", json.dumps(d.get("write_action"), indent=2))
          print("formentry_url_matched:", d.get("formentry_url_matched"))
          print("formentry_id:", d.get("formentry_id"))
          print("formentry_found_in:", d.get("formentry_found_in"))
          print("coverages_tab:", json.dumps(d.get("coverages_tab")))
          print("coverages_field_count:", (d.get("coverages") or {}).get("field_count"))
          print("modal_found:", d.get("modal_found"), "modal_field_count:", d.get("modal_field_count"))
          print("stopped_off_policy_path:", d.get("stopped_off_policy_path"))
          print("error:", d.get("error"))

          auth_ok = bool(d.get("landing_looks_authenticated", False))
          out_gh = os.environ.get("GITHUB_OUTPUT")
          if out_gh:
              with open(out_gh, "a") as f:
                  f.write(f"authenticated={'true' if auth_ok else 'false'}\n")

          if not auth_ok:
              status_path = os.path.join(os.environ["RUNNER_TEMP"], "formentry-mint-retry-status.json")
              status_payload = {
                  "capture": "mint-formentry-retry-capture-coverages",
                  "captured_at": d.get("captured_at"),
                  "verdict": "REFUSED_UNAUTHENTICATED",
                  "landing_url": d.get("landing_url"),
                  "landing_looks_authenticated": False,
                  "detail": (
                      "Mint retry refused: landing page was not authenticated. "
                      "No click was performed."
                  ),
              }
              with open(status_path, "w") as f:
                  json.dump(status_payload, f, indent=2)
              print("Written refusal status to:", status_path)
          EOF

      - name: Upload dump artifact
        if: steps.retrieve.outputs.authenticated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: formentry-mint-retry-${{ github.run_id }}
          path: ${{ runner.temp }}/formentry-mint-retry-dump.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload refused status artifact
        if: steps.retrieve.outputs.authenticated != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: formentry-mint-retry-status-${{ github.run_id }}
          path: ${{ runner.temp }}/formentry-mint-retry-status.json
          if-no-files-found: error
          retention-days: 90

      - name: Refuse unauthenticated mint retry
        if: steps.retrieve.outputs.authenticated != 'true'
        run: |
          set -euo pipefail
          echo "FATAL: FormEntry mint retry refused: landing_looks_authenticated is false; no click was performed" >&2
          exit 1
