name: Deploy immutable release to Production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character release commit
        required: true
        type: string
      sha256:
        description: Exact SHA-256 from the approved immutable artifact
        required: true
        type: string
      test_run_id:
        description: Successful protected-main Test certification run (required for release promotion)
        required: false
        type: string
      test_artifact_id:
        description: Immutable verified-test-release artifact ID (required for release promotion)
        required: false
        type: string
      confirmation:
        description: Type DEPLOY_TO_HERMES_POC_01
        required: true
        type: string
      lost_customer_operation:
        description: Optional lost-customer operation through the protected Production controller
        required: true
        default: none
        type: choice
        options: [none, inspect, deploy, dry-run]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: robie-hermes-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DEPLOY_TO_HERMES_POC_01' &&
      inputs.lost_customer_operation == 'none'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: streetsmart-hermes-poc
      PROJECT_NUMBER: "751771086524"
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
      PRODUCTION_VM_ID: "5649534881067121807"
      STAGING_DIR: /var/tmp/robie-production-deploy/${{ inputs.commit }}
    steps:
      - name: Validate immutable release request
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          REQUESTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "${REQUESTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REQUESTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "${PROJECT_ID}" = "streetsmart-hermes-poc"
          test "${ZONE}" = "us-east1-b"
          test "${PRODUCTION_VM}" = "hermes-poc-01"

      - name: Check out protected deployment controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Download and verify the exact Test package (never rebuild)
        id: release
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          REQUESTED_SHA256: ${{ inputs.sha256 }}
          TEST_RUN_ID: ${{ inputs.test_run_id }}
          TEST_ARTIFACT_ID: ${{ inputs.test_artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/verified-test-package"
          PYTHONPATH=controller python -m robie_job_engine.release_promotion download \
            --directory "${bundle}" --commit "${REQUESTED_COMMIT}" --sha256 "${REQUESTED_SHA256}" \
            --run-id "${TEST_RUN_ID}" --artifact-id "${TEST_ARTIFACT_ID}"
          release_commit="${REQUESTED_COMMIT}"
          release_archive="${bundle}/robie-hermes-${REQUESTED_COMMIT:0:12}.tgz"
          release_sha256="$(sha256sum "${release_archive}" | cut -d' ' -f1)"
          test "${release_commit}" = "${REQUESTED_COMMIT}"
          test "${release_sha256}" = "${REQUESTED_SHA256}"
          bash controller/scripts/verify-release.sh "${release_archive}" "${release_archive}.sha256"
          echo "archive=${release_archive}" >>"${GITHUB_OUTPUT}"
          echo "checksum=${release_archive}.sha256" >>"${GITHUB_OUTPUT}"
          echo "sha256=${release_sha256}" >>"${GITHUB_OUTPUT}"
          echo "installer_sha256=$(sha256sum controller/scripts/deploy-production-release.sh | cut -d' ' -f1)" >>"${GITHUB_OUTPUT}"
          mkdir -p "${RUNNER_TEMP}/production-transfer"
          cp "${release_archive}" "${release_archive}.sha256" controller/scripts/deploy-production-release.sh "${RUNNER_TEMP}/production-transfer/"

      - name: Publish exact Production transfer bundle
        id: transfer_bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-transfer/*
          retention-days: 1
          if-no-files-found: error

      - name: Authenticate with short-lived Production identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Refuse every target except the designated Production VM
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gcloud compute instances describe "${PRODUCTION_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" \
            --format='value(name,id,status,zone.basename())')"
          read -r name instance_id status zone <<<"${actual}"
          test "${name}" = "hermes-poc-01"
          test "${instance_id}" = "${PRODUCTION_VM_ID}"
          test "${status}" = "RUNNING"
          test "${zone}" = "us-east1-b"

      - name: Create bounded Production staging directory
        run: |
          gcloud compute ssh "${PRODUCTION_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-poc-01 && mkdir -p '${STAGING_DIR}'"

      - name: Transfer only the exact artifact and reviewed installer
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.transfer_bundle.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.transfer_bundle.outputs.artifact-digest }}
          ARCHIVE_SHA256: ${{ steps.release.outputs.sha256 }}
          INSTALLER_SHA256: ${{ steps.release.outputs.installer_sha256 }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          REQUESTED_SHA256: ${{ inputs.sha256 }}
        run: |
          python controller/scripts/transfer-production-artifact.py

      - name: Install and verify Production
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          REQUESTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          archive="${STAGING_DIR}/$(basename '${{ steps.release.outputs.archive }}')"
          checksum="${archive}.sha256"
          gcloud compute ssh "${PRODUCTION_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="sudo bash '${STAGING_DIR}/deploy-production-release.sh' --archive '${archive}' --checksum '${checksum}' --commit '${REQUESTED_COMMIT}' --digest '${REQUESTED_SHA256}'"

      - name: Retrieve immutable Production evidence
        if: always()
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          short="${REQUESTED_COMMIT:0:12}"
          evidence="${RUNNER_TEMP}/production-deploy-evidence.json"
          if gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            "${PRODUCTION_VM}:/opt/streetsmart-hermes/deployments/${short}/production-deploy-evidence.json" \
            "${evidence}"; then
            {
              echo "## ROBIE Production deployment"
              echo
              echo '```json'
              cat "${evidence}"
              echo '```'
            } >>"${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## ROBIE Production deployment"
              echo
              echo "No final evidence file was available. The deployment is not verified."
            } >>"${GITHUB_STEP_SUMMARY}"
          fi

  lost-customer-retention:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DEPLOY_TO_HERMES_POC_01' &&
      inputs.lost_customer_operation != 'none'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate with short-lived Production identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Inspect for existing lost-customer jobs
        run: |
          echo "vm_service_accounts=$(gcloud compute instances describe "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --format='value(serviceAccounts.email)' | tr '\n' ',')"
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap --command='set -e; test "$(hostname -s)" = hermes-poc-01; systemctl list-timers --all --no-pager | grep -Ei "lost.customer|retention" || true; systemctl status streetsmart-lost-customer-retention.timer --no-pager || true; systemctl show streetsmart-lost-customer-retention.timer -p Unit -p NextElapseUSecRealtime -p LastTriggerUSec --no-pager || true; systemctl show streetsmart-lost-customer-retention.service -p ExecStart -p User -p Group -p WorkingDirectory --no-pager || true; test ! -e /etc/systemd/system/monthly-lost-customer-retention-review.timer || { echo DUPLICATE_LOCAL_STYLE_TIMER; exit 3; }'
      - name: Install dedicated lost-customer service and timer
        if: inputs.lost_customer_operation == 'deploy'
        run: |
          stage="/var/tmp/lost-customer-retention-${GITHUB_SHA}"
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap --command="mkdir -p '${stage}'"
          gcloud compute scp --recurse --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap robie_job_engine/lost_customer_retention.py scripts/run_lost_customer_retention.py scripts/install-lost-customer-retention-production.sh deploy/systemd/streetsmart-lost-customer-retention.service deploy/systemd/streetsmart-lost-customer-retention.timer deploy/accountability/lost-customer-retention-config.example.json "${PRODUCTION_VM}:${stage}/"
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap --command="set -e; sudo install -o root -g root -m 0644 '${stage}/lost_customer_retention.py' /opt/streetsmart-hermes/releases/current/robie_job_engine/lost_customer_retention.py; sudo install -o root -g root -m 0755 '${stage}/run_lost_customer_retention.py' /opt/streetsmart-hermes/releases/current/scripts/run_lost_customer_retention.py; sudo install -o root -g root -m 0755 '${stage}/install-lost-customer-retention-production.sh' /opt/streetsmart-hermes/releases/current/scripts/install-lost-customer-retention-production.sh; sudo install -o root -g root -m 0644 '${stage}/streetsmart-lost-customer-retention.service' /opt/streetsmart-hermes/releases/current/deploy/systemd/streetsmart-lost-customer-retention.service; sudo install -o root -g root -m 0644 '${stage}/streetsmart-lost-customer-retention.timer' /opt/streetsmart-hermes/releases/current/deploy/systemd/streetsmart-lost-customer-retention.timer; sudo install -o root -g root -m 0644 '${stage}/lost-customer-retention-config.example.json' /opt/streetsmart-hermes/releases/current/deploy/accountability/lost-customer-retention-config.example.json; sudo bash /opt/streetsmart-hermes/releases/current/scripts/install-lost-customer-retention-production.sh"
      - name: Validate June-August backfill without sending
        if: inputs.lost_customer_operation == 'dry-run'
        run: |
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap --command='sudo env PYTHONPATH=/opt/streetsmart-hermes/releases/current /opt/streetsmart-hermes/.hermes/hermes-agent/venv/bin/python /opt/streetsmart-hermes/releases/current/scripts/run_lost_customer_retention.py --dry-run --backfill'
