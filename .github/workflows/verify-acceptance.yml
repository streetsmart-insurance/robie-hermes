name: Acceptance verifier (read-only)

# Governed read-only acceptance verifier for the ROBIE email policy-setup
# path. Takes an applicant ID, a policy number, and a job ID as INPUTS and
# re-reads destination state from primary sources on hermes-poc-01:
#   - PolicyApi policy search for the named policy (number, status, carrier,
#     effective, expiration)
#   - an applicant-scoped policy list attempt (every policy + total count;
#     reported UNCHECKED with the reason if no endpoint answers)
#   - the applicant's Document Library (classic REST)
#   - the job's own rows from jobs.db (jobs, checkpoints, playwright_exec,
#     verification_evidence) for the PASSED job ID — nothing is hardcoded
#
# Touches nothing. All EZLynx calls are GETs; jobs.db is opened read-only
# (query_only). No secret values are printed. The verdict is a JSON
# artifact with an explicit "not_checked" list.
#
# Dispatch ONLY from main: the Production environment's deployment branch
# policy allows main and nothing else (proven 2026-09-12 — dispatches from a
# feature branch fail at job startup: no runner assigned, zero steps).
# The confirmation phrase is the second gate. Read-only by construction,
# so there is nothing a ref could make it write.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VERIFY_ACCEPTANCE
        required: true
        type: string
      applicant_id:
        description: EZLynx applicant ID (digits only)
        required: true
        type: string
      policy_number:
        description: Policy number to look up
        required: true
        type: string
      job_id:
        description: jobs.db job ID to report on (passed as input, never hardcoded)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    if: inputs.confirmation == 'VERIFY_ACCEPTANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
      JOB_DB: /opt/streetsmart-hermes/robie-job-engine/data/jobs.db
      SECRET_REF: projects/751771086524/secrets/ezlynx-api-prod/versions/latest
      STAGING: /var/tmp/robie-acceptance-verify/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3

      - name: Validate bounded request
        run: |
          set -euo pipefail
          test "${PRODUCTION_VM}" = "hermes-poc-01"
          test "${PROJECT_ID}" = "streetsmart-hermes-poc"
          test "${JOB_DB}" = "/opt/streetsmart-hermes/robie-job-engine/data/jobs.db"
          [[ "${{ inputs.applicant_id }}" =~ ^[0-9]{1,12}$ ]] || { echo "applicant_id must be digits"; exit 1; }
          [[ "${{ inputs.policy_number }}" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "policy_number has unexpected characters"; exit 1; }
          [[ "${{ inputs.job_id }}" =~ ^[a-f0-9-]{36}$ ]] || { echo "job_id must be a UUID"; exit 1; }

      - name: Run read-only acceptance verification
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-poc-01 && mkdir -p '${STAGING}'"
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/verify_acceptance.py "${PRODUCTION_VM}:${STAGING}/"
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="sudo python3 '${STAGING}/verify_acceptance.py' --applicant-id '${{ inputs.applicant_id }}' --policy-number '${{ inputs.policy_number }}' --job-id '${{ inputs.job_id }}' --db-path '${JOB_DB}' --secret '${SECRET_REF}'" \
            | tee "${RUNNER_TEMP}/acceptance-verification.json"
          python3 -m json.tool "${RUNNER_TEMP}/acceptance-verification.json" >/dev/null

      - name: Publish evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/acceptance-verification.json
          if-no-files-found: error
          retention-days: 90
