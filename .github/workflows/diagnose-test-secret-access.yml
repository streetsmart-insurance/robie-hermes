name: Diagnose Test VM Secret Manager access (read-only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DIAGNOSE_TEST_SECRET_ACCESS
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DIAGNOSE_TEST_SECRET_ACCESS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Test
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      TEST_VM: hermes-test-01
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1036123102831/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: robie-test-deployer@streetsmart-robie-test.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Refuse every target except Test
        shell: bash
        run: |
          set -euo pipefail
          test "${TEST_VM}" = hermes-test-01
      - name: What service account does hermes-test-01 actually run as
        shell: bash
        run: |
          set +e -uo pipefail
          out=$(gcloud compute instances describe "${TEST_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" \
            --format='value(serviceAccounts[].email)' 2>&1)
          code=$?
          escaped=$(printf '%s' "$out" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "::notice::hermes-test-01 service account (exit ${code}): ${escaped}"
          exit 0
      - name: What ezlynx-* secrets exist in this project
        shell: bash
        run: |
          set +e -uo pipefail
          out=$(gcloud secrets list --project="${PROJECT_ID}" \
            --filter='name~ezlynx' --format='value(name)' 2>&1)
          code=$?
          escaped=$(printf '%s' "$out" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "::notice::ezlynx-named secrets in ${PROJECT_ID} (exit ${code}, names only, no payloads): ${escaped}"
          exit 0
      - name: Does the Test VM service account have secretAccessor on the EZLynx secrets
        if: always()
        shell: bash
        run: |
          set +e -uo pipefail
          test_sa="$(gcloud compute instances describe "${TEST_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" \
            --format='value(serviceAccounts[0].email)' 2>/dev/null)"
          echo "::notice::Test VM service account: ${test_sa:-<none found>}"
          for secret_name in ezlynx-username ezlynx-password; do
            out=$(gcloud secrets get-iam-policy "${secret_name}" --project="${PROJECT_ID}" \
              --format='value(bindings)' 2>&1)
            code=$?
            escaped=$(printf '%s' "$out" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::notice::IAM bindings on ${secret_name} (exit ${code}, roles only, no payloads): ${escaped}"
          done
          exit 0
