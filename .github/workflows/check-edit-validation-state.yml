name: Check Edit validation state (read-only)

# READ-ONLY. Performs zero writes: no clicks, no fills, no typing.
#
# Context: after two authorized "Save & Continue Edit" activations produced
# no navigation and no FormEntry URL, Carlo hypothesized the save failed
# validation -- select#BillingType was blank (---Select---) in the pre-click
# header capture, possibly because D01 was created by API with a minimal
# payload. This run reads the current validation state of the Edit page
# literally: .field-validation-error text, .validation-summary-errors text,
# [aria-invalid="true"] ids, every <select> still reading ---Select---, and
# select#BillingType's current value/text.
#
# Limitation, stated plainly: this reads the CURRENT page state on a fresh
# load. It cannot reconstruct the transient post-click DOM from the earlier
# mint runs. A clean result here neither confirms nor kills the hypothesis
# that validation blocked those specific activations.
#
# Dispatch ONLY from main: the Production environment's deployment branch
# policy allows main and nothing else.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
      STAGING: /var/tmp/robie-validation-check/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: '584.0.0'  # Pinned 2026-09-12: runner-preinstalled gcloud 583.0.0 crashes on 'gcloud compute ssh' (TypeError: quote_from_bytes() expected bytes); 584.0.0 is the version setup-gcloud@latest resolved on run 34694728948, whose SSH staging succeeded.

      - name: Enforce read-only discipline
        run: |
          set -euo pipefail
          S=scripts/check_edit_validation_state.py
          echo "== no click/fill/type/check/select_option =="
          ! grep -q '\.click(' "$S"
          ! grep -q '\.fill(' "$S"
          ! grep -q '\.type(' "$S"
          ! grep -q '\.check(' "$S"
          ! grep -q '\.select_option(' "$S"
          echo "== exactly one page.goto =="
          test "$(grep -c 'page\.goto' "$S")" = "1"
          echo "== waits never use networkidle =="
          ! grep -q 'networkidle' "$S"
          echo "== allowlisted Edit URL present =="
          grep -q 'applicantportal/Policy/Actions/Edit/220250093/83651751' "$S"
          echo "read-only gate OK"

      - name: Stage check script on Production
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-poc-01 && mkdir -p '${STAGING}'"
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/check_edit_validation_state.py "${PRODUCTION_VM}:${STAGING}/"

      - name: Run validation-state check (read-only)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          gcloud compute ssh "${PRODUCTION_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="set -euo pipefail
              mkdir -p '${STAGING}'
              PY=''
              for cand in \$(ls -d /opt/streetsmart-hermes/.local/share/uv/python/*/bin/python3 2>/dev/null) \$(find /opt/streetsmart-hermes -maxdepth 5 -name pyvenv.cfg 2>/dev/null | head -5 | sed 's|pyvenv.cfg|bin/python|') \$(command -v python3 2>/dev/null || true); do
                [ -x \"\$cand\" ] || continue
                if \"\$cand\" -c 'import playwright' 2>/dev/null; then PY=\"\$cand\"; break; fi
                if sudo -n \"\$cand\" -c 'import playwright' 2>/dev/null; then PY=\"sudo -n \$cand\"; break; fi
              done
              if [ -z \"\$PY\" ]; then echo 'NO_PLAYWRIGHT_PYTHON'; exit 1; fi
              echo \"using python: \$PY\"
              if ! curl -sf --max-time 10 http://127.0.0.1:9222/json/version >/dev/null; then echo 'NO_CDP_LISTENER'; exit 1; fi
              echo 'CDP listener up'
              \$PY '${STAGING}/check_edit_validation_state.py' --out '${STAGING}/dump.json'"

      - name: Retrieve dump
        id: retrieve
        if: always()
        run: |
          set -euo pipefail
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            "${PRODUCTION_VM}:${STAGING}/dump.json" "${RUNNER_TEMP}/validation-check-dump.json"
          python3 - <<'EOF'
          import json, os
          p = os.path.join(os.environ["RUNNER_TEMP"], "validation-check-dump.json")
          d = json.load(open(p))
          print("ok:", d.get("ok"))
          print("landing_url:", d.get("landing_url"))
          print("landing_looks_authenticated:", d.get("landing_looks_authenticated"))
          print("writes_performed:", d.get("writes_performed"))
          print("validation:", json.dumps(d.get("validation"), indent=2))
          print("stopped_off_policy_path:", d.get("stopped_off_policy_path"))
          print("error:", d.get("error"))
          out_gh = os.environ.get("GITHUB_OUTPUT")
          if out_gh:
              with open(out_gh, "a") as f:
                  f.write(f"authenticated={'true' if d.get('landing_looks_authenticated') else 'false'}\n")
          EOF

      - name: Upload dump artifact
        if: steps.retrieve.outputs.authenticated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validation-check-${{ github.run_id }}
          path: ${{ runner.temp }}/validation-check-dump.json
          if-no-files-found: error
          retention-days: 90

      - name: Refuse unauthenticated check
        if: steps.retrieve.outputs.authenticated != 'true'
        run: |
          set -euo pipefail
          echo "FATAL: validation check refused: landing_looks_authenticated is false" >&2
          exit 1
