name: Probe EZLynx Documents API

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROBE_EZLYNX_API_ON_HERMES_POC_01
        required: true
        type: string
      environment:
        description: EZLynx API environment to probe
        required: true
        type: choice
        options: [uat, prod]
        default: uat

permissions:
  contents: read
id-token: write

jobs:
  probe:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PROBE_EZLYNX_API_ON_HERMES_POC_01'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      PRODUCTION_VM: hermes-poc-01
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Refuse every target except Production
        run: |
          set -euo pipefail
          test "${PRODUCTION_VM}" = "hermes-poc-01"
          test "${PROJECT_ID}" = "streetsmart-hermes-poc"
          test "${ZONE}" = "us-east1-b"
      - name: Probe EZLynx API from hermes-poc-01
        run: |
          set -euo pipefail
          SSH="gcloud compute ssh ${PRODUCTION_VM} --project=${PROJECT_ID} --zone=${ZONE} --tunnel-through-iap"
          REMOTE_DIR=/var/tmp/robie-ezlynx-probe/${{ github.run_id }}
          $SSH --command="mkdir -p ${REMOTE_DIR}"
          # Ship the candidate engine code plus the probe; the probe runs the
          # PR's ezlynx_api module, not the deployed release.
          gcloud compute scp --recurse robie_job_engine scripts/probe_ezlynx_document_api.py \
            "${PRODUCTION_VM}:${REMOTE_DIR}/" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap
          case "${{ inputs.environment }}" in
            uat)  SECRET_REF="projects/751771086524/secrets/ezlynx-api-uat/versions/latest" ;;
            prod) SECRET_REF="projects/751771086524/secrets/ezlynx-api-prod/versions/latest" ;;
          esac
          $SSH --command="sudo python3 ${REMOTE_DIR}/probe_ezlynx_document_api.py '${{ inputs.environment }}' '${SECRET_REF}' '${REMOTE_DIR}/robie_job_engine'" \
            | tee "${RUNNER_TEMP}/ezlynx-probe-${{ inputs.environment }}.json"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Publish probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: ezlynx-api-probe-${{ inputs.environment }}
          path: ${{ runner.temp }}/ezlynx-probe-*.json
          if-no-files-found: warn
