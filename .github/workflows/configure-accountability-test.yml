name: Configure Test accountability privately

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-accountability-test.yml
      - scripts/configure-accountability-test.py

permissions:
  contents: read
  id-token: write

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Test
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      TEST_VM: hermes-test-01
      STAGING: /var/tmp/robie-accountability-config/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/1036123102831/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: robie-test-deployer@streetsmart-robie-test.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Refuse every target except Test
        run: |
          set -euo pipefail
          test "${PROJECT_ID}" = streetsmart-hermes-poc
          test "${TEST_VM}" = hermes-test-01
      - name: Configure only after private access checks pass
        run: |
          set -euo pipefail
          gcloud compute ssh "${TEST_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-test-01 && mkdir -p '${STAGING}'"
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/configure-accountability-test.py "${TEST_VM}:${STAGING}/"
          gcloud compute ssh "${TEST_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="sudo env PYTHONPATH=/opt/streetsmart-hermes-test/releases/current/.gateway-runtime:/opt/streetsmart-hermes-test/releases/current python3 '${STAGING}/configure-accountability-test.py'" \
            | tee "${RUNNER_TEMP}/accountability-config-result.json"
      - name: Publish redacted configuration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accountability-test-private-config-result
          path: ${{ runner.temp }}/accountability-config-result.json
          if-no-files-found: warn
          retention-days: 30
