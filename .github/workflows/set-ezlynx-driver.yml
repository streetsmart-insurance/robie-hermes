name: Set shared EZLynx driver

on:
  workflow_dispatch:
    inputs:
      action:
        description: Check a driver IN or check everyone OUT
        required: true
        type: choice
        options: [check-in, check-out]
      holder:
        description: Driver receiving the lease (ignored for check-out)
        required: true
        type: choice
        options: [PRODUCTION, TEST]
      ttl_minutes:
        description: Lease lifetime; renew before it expires
        required: true
        default: "1440"
        type: choice
        options: [120, 480, 1440, 4320, 10080]
      moe_confirmation:
        description: Type MOE_CONFIRMED_ONE_DRIVER
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  set-driver:
    if: github.ref == 'refs/heads/main' && inputs.moe_confirmation == 'MOE_CONFIRMED_ONE_DRIVER'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Atomically update the shared driver lease
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          HOLDER: ${{ inputs.holder }}
          TTL_MINUTES: ${{ inputs.ttl_minutes }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          lease_file="${RUNNER_TEMP}/driver.json"
          current="$(gcloud compute project-info describe \
            --project=streetsmart-hermes-poc \
            --flatten='commonInstanceMetadata.items[]' \
            --filter='commonInstanceMetadata.items.key=robie-ezlynx-driver' \
            --format='value(commonInstanceMetadata.items.value)' || true)"
          CURRENT="${current}" python3 - <<'PY'
          import json
          import os

          raw = os.environ.get("CURRENT", "").strip()
          if not raw or os.environ["ACTION"] != "check-in":
              raise SystemExit(0)
          try:
              current = json.loads(raw)
          except ValueError:
              raise SystemExit("existing driver metadata is malformed; check OUT before replacing it")
          if current.get("state") == "IN" and current.get("holder") != os.environ["HOLDER"]:
              raise SystemExit("another environment is IN; check it OUT through Moe before switching")
          PY
          python3 - "${lease_file}" <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import sys

          now = datetime.datetime.now(datetime.timezone.utc)
          checking_in = os.environ["ACTION"] == "check-in"
          payload = {
              "version": 1,
              "state": "IN" if checking_in else "OUT",
              "holder": os.environ["HOLDER"] if checking_in else "NONE",
              "expires_at": (
                  now + datetime.timedelta(minutes=int(os.environ["TTL_MINUTES"]))
              ).isoformat().replace("+00:00", "Z") if checking_in else now.isoformat().replace("+00:00", "Z"),
              "checked_in_by": os.environ["ACTOR"],
              "updated_at": now.isoformat().replace("+00:00", "Z"),
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(payload, separators=(",", ":")))
          PY
          gcloud compute project-info add-metadata \
            --project=streetsmart-hermes-poc \
            --metadata-from-file=robie-ezlynx-driver="${lease_file}"
          echo "### EZLynx driver ${ACTION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Holder: $([[ "${ACTION}" == check-in ]] && echo "${HOLDER}" || echo NONE)" >> "${GITHUB_STEP_SUMMARY}"
          echo "Requested by: ${ACTOR}" >> "${GITHUB_STEP_SUMMARY}"
