name: Set shared EZLynx driver

on:
  workflow_dispatch:
    inputs:
      action:
        description: Check a driver IN or check everyone OUT
        required: true
        type: choice
        options: [check-in, check-out]
      holder:
        description: Driver receiving the lease (ignored for check-out)
        required: true
        type: choice
        options: [PRODUCTION, TEST]
      ttl_minutes:
        description: Lease lifetime; renew before it expires
        required: true
        default: "1440"
        type: choice
        options: [120, 480, 1440, 4320, 10080]
      moe_confirmation:
        description: Type MOE_CONFIRMED_ONE_DRIVER
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  set-driver:
    if: github.ref == 'refs/heads/main' && inputs.moe_confirmation == 'MOE_CONFIRMED_ONE_DRIVER'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Atomically update the shared driver lease
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          HOLDER: ${{ inputs.holder }}
          TTL_MINUTES: ${{ inputs.ttl_minutes }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          describe_file="${RUNNER_TEMP}/project-info.json"
          lease_file="${RUNNER_TEMP}/driver.json"
          gcloud compute project-info describe \
            --project=streetsmart-hermes-poc \
            --format=json > "${describe_file}"
          python3 scripts/set_ezlynx_driver_lease.py \
            --describe-file "${describe_file}" \
            --lease-file "${lease_file}"
          gcloud compute project-info add-metadata \
            --project=streetsmart-hermes-poc \
            --metadata-from-file=robie-ezlynx-driver="${lease_file}"
          echo "### EZLynx driver ${ACTION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Holder: $([[ "${ACTION}" == check-in ]] && echo "${HOLDER}" || echo NONE)" >> "${GITHUB_STEP_SUMMARY}"
          echo "Requested by: ${ACTOR}" >> "${GITHUB_STEP_SUMMARY}"
