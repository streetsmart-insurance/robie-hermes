name: Why didn't the Chat message become a job

# The milestone harness can only see the last hop of the Chat chain. When it
# says BLOCKED it means "no job row appeared" - true, and useless on its own,
# because it does not say whether the message ever reached the box.
#
#   Chat message -> chat_event_queue row -> jobs row -> worker + verifier
#
# This reads all three on hermes-test-01 and says which hop is broken.
# Read-only: opens the database immutably, reads systemd, reads the journal.
# It cannot seed, retry or modify a job.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DIAGNOSE_CHAT_INTAKE_ON_HERMES_TEST_01
        required: true
        type: string
      hours:
        description: How far back to look
        required: true
        type: string
        default: "24"

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DIAGNOSE_CHAT_INTAKE_ON_HERMES_TEST_01'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Test
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      TEST_VM: hermes-test-01
      JOB_DB: /opt/streetsmart-hermes-test/robie-job-engine/data/jobs.db
      STAGING: /var/tmp/robie-chat-diagnosis/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1036123102831/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: robie-test-deployer@streetsmart-robie-test.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3

      - name: Refuse every target except Test
        run: |
          set -euo pipefail
          test "${TEST_VM}" = hermes-test-01
          case "${JOB_DB}" in
            *-test*) ;;
            *) echo "refusing: JOB_DB is not a Test path"; exit 1 ;;
          esac

      - name: Stage the diagnosis script
        run: |
          set -euo pipefail
          gcloud compute ssh "${TEST_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-test-01 && mkdir -p '${STAGING}'"
          gcloud compute scp --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/diagnose_chat_intake.py "${TEST_VM}:${STAGING}/"

      - name: Read the Chat intake chain
        run: |
          set -euo pipefail
          set +e
          gcloud compute ssh "${TEST_VM}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="sudo python3 ${STAGING}/diagnose_chat_intake.py --db-path ${JOB_DB} --hours ${{ inputs.hours }}" \
            2>&1 | tee "${RUNNER_TEMP}/chat-intake.txt"
          rc=${PIPESTATUS[0]}
          set -e
          {
            if [ "${rc}" -eq 0 ]; then
              echo "## Intake chain looks intact"
            else
              echo "## Found where the chain breaks — see WHAT THIS MEANS at the bottom"
            fi
            echo
            echo '```'
            cat "${RUNNER_TEMP}/chat-intake.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          test "${rc}" -eq 0

      - name: Publish output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-intake-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/*.txt
          if-no-files-found: warn
          retention-days: 30
