name: Verify disabled Ascend API on Test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VERIFY_ASCEND_DISABLED_ON_HERMES_TEST_01
        required: true
        type: string
      expected_sha:
        description: Exact deployed Test commit SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-disabled:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'VERIFY_ASCEND_DISABLED_ON_HERMES_TEST_01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Test
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      TEST_VM: hermes-test-01
      TEST_ROOT: /opt/streetsmart-hermes-test
      STAGING_ROOT: /var/tmp/robie-ascend-disabled-proof
    steps:
      - uses: actions/checkout@v4
      - name: Refuse unsafe inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${TEST_VM}" = hermes-test-01
          test "${TEST_ROOT}" = /opt/streetsmart-hermes-test
          [[ "${{ inputs.expected_sha }}" =~ ^[0-9a-f]{40}$ ]]
      - name: Authenticate with short-lived Test identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1036123102831/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: robie-test-deployer@streetsmart-robie-test.iam.gserviceaccount.com
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Transfer exact verification script
        shell: bash
        run: |
          set -euo pipefail
          staging="${STAGING_ROOT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud compute ssh "${TEST_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-test-01 && mkdir -p '${staging}'"
          gcloud compute scp \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/verify-ascend-disabled-test.sh \
            "${TEST_VM}:${staging}/"
      - name: Verify deployed Test service fails closed without Ascend access
        shell: bash
        run: |
          set -euo pipefail
          staging="${STAGING_ROOT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_log="${RUNNER_TEMP}/ascend-disabled-proof.log"
          if ! gcloud compute ssh "${TEST_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="sudo env EXPECTED_SHA='${{ inputs.expected_sha }}' TEST_ROOT='${TEST_ROOT}' bash '${staging}/verify-ascend-disabled-test.sh'" \
            2>&1 | tee "${remote_log}"; then
            echo "ASCEND DISABLED TEST FAILED" >&2
            exit 3
          fi
          grep -Fq 'ASCEND DISABLED TEST VERIFIED' "${remote_log}" || {
            echo "ASCEND DISABLED TEST UNVERIFIED: proof sentinel missing" >&2
            exit 3
          }
