name: Audit Policy Setup fixture readiness on Test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_POLICY_SETUP_FIXTURES_ON_11185BA7BAD4
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  fixture-readiness:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'AUDIT_POLICY_SETUP_FIXTURES_ON_11185BA7BAD4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Test
    env:
      PROJECT_ID: streetsmart-hermes-poc
      ZONE: us-east1-b
      TEST_VM: hermes-test-01
      TEST_ROOT: /opt/streetsmart-hermes-test
      EXPECTED_TEST_SHA: 11185ba7bad4
      STAGING_ROOT: /var/tmp/robie-policy-setup-fixture-readiness
      ROBIE_ENV: TEST
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with short-lived Test identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1036123102831/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: robie-test-deployer@streetsmart-robie-test.iam.gserviceaccount.com
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Refuse every target except Test
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          test "${TEST_VM}" = hermes-test-01
          test "${TEST_ROOT}" = /opt/streetsmart-hermes-test
          test "${EXPECTED_TEST_SHA}" = 11185ba7bad4
          test "${ROBIE_ENV}" = TEST
          gcloud compute instances describe "${TEST_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" \
            --format='value(name,status)' | grep -q '^hermes-test-01[[:space:]]\+RUNNING$'
      - name: Transfer read-only audit
        shell: bash
        run: |
          set -euo pipefail
          staging="${STAGING_ROOT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud compute ssh "${TEST_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="test \"\$(hostname -s)\" = hermes-test-01 && mkdir -p '${staging}'"
          gcloud compute scp \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            scripts/audit-policy-setup-fixture-readiness.py \
            scripts/run-policy-setup-fixture-readiness-remote.sh \
            "${TEST_VM}:${staging}/"
      - name: Audit Test browser without writes
        shell: bash
        run: |
          set +e -uo pipefail
          staging="${STAGING_ROOT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud compute ssh "${TEST_VM}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap \
            --command="sudo env ROBIE_ENV=TEST TEST_ROOT='${TEST_ROOT}' EXPECTED_TEST_SHA='${EXPECTED_TEST_SHA}' AUDIT_SCRIPT='${staging}/audit-policy-setup-fixture-readiness.py' bash '${staging}/run-policy-setup-fixture-readiness-remote.sh'" \
            >"${RUNNER_TEMP}/fixture-readiness.log" 2>&1
          ssh_status=$?
          cat "${RUNNER_TEMP}/fixture-readiness.log"
          ok=1
          [ "${ssh_status}" -eq 0 ] || ok=0
          if [ "${ok}" -eq 1 ] && ! grep -Fq '"result": "TEST READINESS VERIFIED"' "${RUNNER_TEMP}/fixture-readiness.log"; then
            ok=0
          fi
          if [ "${ok}" -eq 1 ] && ! grep -Fq '"consequential_writes": 0' "${RUNNER_TEMP}/fixture-readiness.log"; then
            ok=0
          fi
          if [ "${ok}" -eq 1 ] && ! grep -Fq '"production_touched": false' "${RUNNER_TEMP}/fixture-readiness.log"; then
            ok=0
          fi
          if [ "${ok}" -ne 1 ]; then
            log_bytes=$(wc -c < "${RUNNER_TEMP}/fixture-readiness.log" | tr -d '[:space:]')
            echo "::group::fixture-readiness.log (audit failed, ssh_status=${ssh_status}, log_bytes=${log_bytes})"
            cat "${RUNNER_TEMP}/fixture-readiness.log"
            echo "::endgroup::"
            escaped=$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "${RUNNER_TEMP}/fixture-readiness.log")
            echo "::error::fixture-readiness audit failed: ssh_status=${ssh_status} log_bytes=${log_bytes}%0A${escaped}"
            exit 1
          fi
