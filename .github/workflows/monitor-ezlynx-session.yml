# Read-only heartbeat for the EZLynx browser session on Production.
#
# Why this exists: on 2026-09-11 the session expired quietly. Three jobs failed
# over five hours and each reported a different downstream symptom. Nothing
# watched the session itself. This does.
#
# Read-only. It never logs in, never writes, never restarts anything.
#
name: Monitor EZLynx session on Production

on:
  schedule:
    - cron: "0 * * * *"   # hourly; tighten once it has proven quiet
  workflow_dispatch:
    inputs:
      probe:
        description: "Also run the authoritative navigation probe"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  check-session:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/751771086524/locations/global/workloadIdentityPools/github-production/providers/github-main
          service_account: robie-production-deployer@streetsmart-hermes-poc.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3

      - name: Read the EZLynx session state
        id: session
        run: |
          set -uo pipefail
          PROBE_FLAG=""
          if [ "${{ inputs.probe || 'true' }}" = "true" ]; then
            PROBE_FLAG="--probe"
          fi
          # Run the checker on the box with the release interpreter, not with
          # whatever python3 happens to be on PATH in an ad-hoc ssh session.
          set +e
          OUTPUT=$(gcloud compute ssh hermes-poc-01 \
            --project=streetsmart-hermes-poc \
            --zone=us-east1-b \
            --tunnel-through-iap \
            --command="sudo /opt/streetsmart-hermes/.hermes/hermes-agent/venv/bin/python \
              /opt/streetsmart-hermes/releases/current/scripts/check_ezlynx_session.py \
              --json ${PROBE_FLAG}")
          STATUS=$?
          set -e
          echo "$OUTPUT"
          echo "exit_code=${STATUS}" >> "$GITHUB_OUTPUT"
          {
            echo "### EZLynx session check"
            echo ""
            echo '```json'
            echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail loudly when the session is provably logged out
        if: steps.session.outputs.exit_code == '2'
        run: |
          echo "::error title=EZLynx session logged out::The persistent Chrome on hermes-poc-01 is logged out of EZLynx. Policy work through the browser will fail until it is re-authenticated through the Secret Manager credential path."
          exit 1

      - name: Warn when the session state could not be determined
        if: steps.session.outputs.exit_code == '1'
        run: |
          echo "::warning title=EZLynx session undetermined::Could not establish session state. This is a different failure from a logged-out session - check CDP on 127.0.0.1:9222 and whether playwright is importable."
